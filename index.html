<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="assets/tema.css">
<link rel="stylesheet" href="assets/modulos.css">
<link rel="stylesheet" href="assets/extras.css">
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<title>Central Pessoal</title>
<style>
*{box-sizing:border-box}
body{margin:0}
main{max-width:960px;margin:0 auto;padding:16px 16px 64px;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
header.top h1{font-size:22px}
.sp{flex:1}
.destaque{padding:22px 20px}
.destaque h2{font-size:clamp(28px,7vw,40px);max-width:18ch}
.destaque p{margin:8px 0 0;color:var(--t-muted)}
.pr{display:flex;gap:12px;align-items:center;margin-top:16px;padding:12px 14px;background:var(--t-surface);border-left:4px solid var(--t-accent2);border:1px solid var(--t-line);border-left-width:4px}
.selo{flex:none;width:38px;height:38px;display:grid;place-items:center;background:var(--t-accent2);color:#3B2A33;font:700 13px var(--f-mono)}
.pr b{font:600 17px var(--f-titulo)}
.pr small{display:block;color:var(--t-muted);font-size:13px}
h2.sec{font-size:13px;margin:26px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
a.mod{display:flex;flex-direction:column;gap:10px;padding:16px;background:var(--t-surface);border:1px solid var(--t-line);border-top:4px solid var(--m);color:inherit;text-decoration:none;border-radius:var(--raio);min-height:150px}
a.mod:hover{box-shadow:0 10px 24px -16px var(--m)}
a.mod .cab{display:flex;align-items:center;gap:10px}
a.mod h3{font-size:19px}
a.mod .ic{width:34px;height:34px;flex:none}
a.mod .go{margin-left:auto;color:var(--t-muted);font-size:18px}
.num{font:600 30px/1 var(--f-titulo);letter-spacing:var(--titulo-tracking)}
.num small{font:500 13px var(--f-texto);color:var(--t-muted);letter-spacing:0}
.mini{font-size:13px;color:var(--t-muted)}
.up{color:var(--t-ok);font:500 12px var(--f-mono)}
.dn{color:var(--t-muted);font:500 12px var(--f-mono)}
.barra{height:8px;background:var(--t-line);overflow:hidden}
.barra i{display:block;height:100%;background:var(--t-ok)}
@media (prefers-reduced-motion:no-preference){.barra i{animation:cresce .9s ease-out}@keyframes cresce{from{width:0}}}
.sem{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.sem div{height:22px;border:1px solid var(--t-line);font:500 10px/20px var(--f-mono);text-align:center;color:var(--t-muted)}
.sem div.f{background:color-mix(in srgb,var(--t-ok) 22%,var(--t-surface));border-color:var(--t-ok);color:var(--t-ink)}
.sem div.h{border-color:var(--t-accent);color:var(--t-accent);font-weight:700}
.sem div.p{border-style:dashed;border-color:var(--t-borda);background:repeating-linear-gradient(45deg,var(--t-realce) 0 4px,transparent 4px 8px);color:var(--t-ink)}
.aval{margin-top:16px;padding:16px;background:var(--t-surface);border:1px solid var(--t-line);border-left:4px solid var(--t-accent)}
.aval h3{font-size:18px;margin-bottom:4px}
.aval .q{margin:12px 0 4px;font-size:14px}
.aval .esc{display:flex;gap:6px}
.aval .esc button{flex:1;min-height:44px;font:600 15px var(--f-texto);border:1px solid var(--t-borda);background:var(--t-bg);color:var(--t-ink);border-radius:var(--raio);cursor:pointer}
.aval .esc button[aria-pressed=true]{background:var(--t-accent);border-color:var(--t-accent);color:var(--t-accent-ink)}
.aval .ex{display:flex;justify-content:space-between;font-size:12px;color:var(--t-muted);margin-top:2px}
.aval .acoes{display:flex;gap:8px;margin-top:14px}
.aval .btn{font:600 14px var(--f-texto);padding:10px 16px;border-radius:var(--raio);border:1px solid var(--t-accent);background:var(--t-accent);color:var(--t-accent-ink);cursor:pointer;min-height:44px}
.aval .btn.sec{background:transparent;color:var(--t-accent)}
.marcos{display:flex;gap:8px;flex-wrap:wrap}
.marcos span{font:500 12px var(--f-mono);padding:7px 11px;border:1px solid var(--t-line);background:var(--t-surface);color:var(--t-muted)}
.marcos span.on{border-color:var(--t-ok);color:var(--t-ink);background:color-mix(in srgb,var(--t-ok) 16%,var(--t-surface))}
.marcos span.on::before{content:"✓ ";color:var(--t-ok);font-weight:700}
.erro{padding:14px;border:1px solid var(--t-bad);color:var(--t-bad);margin-top:12px}

.agua{margin-top:12px;padding:14px 16px;background:var(--t-surface);border:1px solid var(--t-line);border-left:4px solid var(--t-c3)}
.agua .topo{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.agua .big{font:600 28px var(--f-titulo);letter-spacing:var(--titulo-tracking)}
.agua .big small{font:400 15px var(--f-texto);color:var(--t-muted)}
.agua .msg{font-size:14px;color:var(--t-muted);margin-top:6px}
.agua .msg.ok{color:var(--t-ok);font-weight:600}
.agua .bts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.agua .bts button{font:600 15px var(--f-texto);min-height:52px;border:1px solid var(--t-c3);background:transparent;color:var(--t-ink);cursor:pointer;border-radius:var(--raio)}
.agua .bts button.pri{background:var(--t-c3);color:#fff}
.agua .desf{margin-top:8px;font:500 13px var(--f-texto);min-height:40px;border:0;background:none;color:var(--t-muted);text-decoration:underline;cursor:pointer}

.parahoje{margin-top:12px}
.parahoje .rotulo{margin-bottom:6px}
.parahoje .chips{display:flex;gap:8px;flex-wrap:wrap}
.parahoje a{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border:1px solid var(--t-borda);background:var(--t-surface);color:var(--t-ink);text-decoration:none;font:600 14px var(--f-texto);border-radius:var(--raio)}
.parahoje a.ok{border-color:var(--t-ok);color:var(--t-ok)}
</style>
<link rel="stylesheet" href="assets/mobile.css">
</head>
<body class="t">
<main>
  <header class="top">
    <svg class="marca" width="40" height="40" viewBox="0 0 48 48" aria-hidden="true"><use href="#marca"/></svg>
    <div><h1>Central Pessoal</h1><div class="rotulo" id="data"></div></div>
    <span class="sp"></span>
  </header>

  <section class="destaque" aria-live="polite">
    <div class="rotulo" style="color:var(--t-muted)">Hoje</div>
    <h2 id="titulo">Carregando…</h2>
    <p id="sub"></p>
    <div id="pr"></div>
  </section>

  <section class="parahoje" id="parahoje" aria-label="Para hoje"></section>

  <section class="agua" id="agua" aria-label="Água de hoje"></section>

  <div id="aval"></div>

  <h2 class="sec rotulo">Seus painéis</h2>
  <div class="grid" id="cards"></div>

  <h2 class="sec rotulo">Marcos</h2>
  <div class="marcos" id="marcos"></div>
  <div id="erro"></div>
</main>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <g id="marca"><rect class="p1" x="4" y="4" width="28" height="28"/><rect class="p2" x="16" y="16" width="28" height="28"/><rect class="x" x="16" y="16" width="16" height="16"/><path class="c" d="M16 32A16 16 0 0 1 32 16V32Z"/></g></defs></svg>

<script src="assets/modulo.js"></script>
<script src="assets/progresso.js"></script>
<script src="assets/integracoes.js"></script>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function brl(n){return 'R$ '+Math.round(n).toLocaleString('pt-BR')}
function barra(p){return '<div class="barra" role="progressbar" aria-valuenow="'+p+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+Math.max(0,Math.min(100,p))+'%"></i></div>'}
function delta(a,b){var d=a-b;return d>0?'<span class="up">▲ +'+d+' vs. semana passada</span>':d<0?'<span class="dn">▼ '+d+' vs. semana passada</span>':'<span class="dn">= semana passada</span>'}

var hoje=new Date();
$('#data').textContent=hoje.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});

function json(r){try{return r&&r.value?JSON.parse(r.value):null}catch(e){return null}}
function docs(s){return s.docs.map(function(d){var o=d.data();o.id=d.id;return o})}
function seguro(p,v){return p.then(function(x){return x},function(){return v})}

async function carregar(){
  var db=await claude.use('db'), st=window.storage;
  var r=await Promise.all([
    seguro(db.collection('sessions').get().then(docs),[]),
    seguro(st.get('config'),null), seguro(st.get('records'),null),
    seguro(st.get('grimorio_entries'),null),
    seguro(db.collection('apps').get().then(docs),[]), seguro(db.doc('profile/main').get().then(function(s){return s.exists?s.data():{}}),{}),
    seguro(db.collection('medidas').get().then(docs),[]),
    seguro(db.doc('fin/base').get().then(function(s){return s.exists?s.data():{}}),{}), seguro(st.get('investEntries'),null),
    seguro(db.collection('mud_imoveis').get().then(docs),[]), seguro(db.collection('mud_cotacoes').get().then(docs),[]),
    seguro(db.doc('mud_checklist/main').get().then(function(s){return s.exists?s.data():{}}),{}), seguro(db.doc('mud_config/main').get().then(function(s){return s.exists?s.data():{}}),{}),
    seguro(fetch('assets/exercicios.json').then(function(x){return x.json()}),{}),
    seguro(db.collection('avaliacao').get().then(docs),[]),
    seguro(db.collection('desafios').get().then(docs),[]),
    seguro(db.collection('refeicoes').get().then(docs),[]),
    seguro(db.collection('agua').get().then(docs),[])
  ]);
  return {sessions:r[0],habitos:{config:json(r[1]),records:CP_INT.mesclar(json(r[2])||{},r[17],r[0])},grimorio:{entries:json(r[3])||[]},apps:r[4],profile:r[5],medidas:r[6],
    fin:{portfolio:(r[7]||{}).portfolio||[]},investEntries:json(r[8])||{},mud:{imoveis:r[9],cotacoes:r[10],check:r[11],cfg:r[12]},exercicios:r[13],avaliacoes:r[14],desafios:r[15],refeicoes:r[16],agua:r[17]};
}

function card(id,href,titulo,corpo){
  return '<a class="mod m-'+id+'" href="'+href+'"><div class="cab">'+CP_ICONE(id,34)+'<h3>'+esc(titulo)+'</h3><span class="go" aria-hidden="true">→</span></div>'+corpo+'</a>';
}

function render(p){
  var n=p.hoje;
  $('#titulo').textContent=n===0?'Um passo pequeno já conta.':n===1?'Você já fez 1 coisa hoje.':'Você já fez '+n+' coisas hoje.';
  $('#sub').textContent=n===0?'Escolha uma coisa só — o resto pode esperar.':'Cada registro conta. O resto do dia é bônus.';
  var pr=p.treino.ultimoPR;
  if(pr&&(hoje-new Date(pr.data+'T12:00:00'))<=14*864e5)
    $('#pr').innerHTML='<div class="pr"><div class="selo">PR</div><div><b>Novo recorde: '+esc(pr.nome)+'</b><small>1RM estimado '+pr.para.toFixed(1).replace('.',',')+' kg · antes '+pr.de.toFixed(1).replace('.',',')+' kg (+'+Math.round(pr.pct)+'%)</small></div></div>';

  var h=p.habitos, sem='';
  if(h.ativo)sem='<div class="sem" role="list" aria-label="Semana">'+h.semana.map(function(d,i){var L='STQQSSD'.charAt(i),nomes=['segunda','terça','quarta','quinta','sexta','sábado','domingo'];
      var estado=d.feito?'feito':d.pausa?'pausa':d.futuro?'a fazer':'sem registro';
      return '<div role="listitem" aria-label="'+nomes[i]+': '+estado+'" class="'+(d.feito?'f':d.pausa?'p':'')+(d.hoje?' h':'')+'">'+(d.feito?'✓':d.pausa?'⏸':L)+'</div>'}).join('')+'</div>';
  var rf=p.refeicoes, semR='';
  if(rf.total)semR='<div class="sem" role="list" aria-label="Semana de refeições">'+rf.semana.map(function(d,i){var L='STQQSSD'.charAt(i),nomes=['segunda','terça','quarta','quinta','sexta','sábado','domingo'];
      var estado=d.feito?'dia bom':d.pausa?'pausa':d.futuro?'a fazer':d.n?'parcial':'sem registro';
      return '<div role="listitem" aria-label="'+nomes[i]+': '+estado+'" class="'+(d.feito?'f':d.pausa?'p':'')+(d.hoje?' h':'')+'">'+(d.feito?'✓':d.pausa?'⏸':L)+'</div>'}).join('')+'</div>';
  var msgR=rf.emRisco?'Hoje ainda dá tempo de manter os '+rf.sequencia+' dias.':rf.total&&rf.sequencia===0&&rf.melhor>0?'Recomeço — sua melhor sequência foi de '+rf.melhor+' dias.':rf.melhor>rf.sequencia?'Melhor sequência: '+rf.melhor+' dias.':'';
  var peso=p.plano.ultimoPeso?'<div class="mini">'+p.plano.ultimoPeso.toFixed(1).replace('.',',')+' kg'+(p.plano.variacao!=null?' ('+(p.plano.variacao>0?'+':'')+p.plano.variacao.toFixed(1).replace('.',',')+' kg desde a 1ª medição)':'')+'</div>':'';
  var corpoPlano=rf.total?'<div class="num">'+rf.sequencia+' <small>dia'+(rf.sequencia===1?'':'s')+' seguidos</small></div>'+semR+'<div class="mini">Hoje: '+rf.hoje+' de 6 refeições'+(rf.hojeInfo.bom?' · dia bom ✓':'')+'</div>'+(msgR?'<div class="mini">'+msgR+'</div>':'')+peso
    :'<div class="mini">'+(rf.hoje?'Hoje: '+rf.hoje+' de 6 refeições.':'Marque as refeições do dia para acompanhar sua sequência.')+'</div>'+peso;
  var rotaPct=Math.round(p.rota.semana/p.rota.meta*100);
  var cards=[
    card('treino','treino.html','Treino','<div class="num">'+p.treino.semana+' <small>treino'+(p.treino.semana===1?'':'s')+' esta semana</small></div>'+delta(p.treino.semana,p.treino.anterior)+'<div class="mini">'+p.treino.total+(p.treino.total===1?' sessão':' sessões')+' · '+p.treino.prs.length+' recorde'+(p.treino.prs.length===1?'':'s')+'</div>'),
    card('plano','plano.html','Plano alimentar',corpoPlano),
    card('habitos','habitos.html','Hábitos',h.ativo?'<div class="num">'+h.sequencia+' <small>dia'+(h.sequencia===1?'':'s')+' seguidos</small></div>'+sem+'<div class="mini">Hoje: '+h.feitosHoje+' de '+h.totalHoje+(h.pausas?' · '+h.pausas+' pausa'+(h.pausas>1?'s':'')+' usada'+(h.pausas>1?'s':''):'')+'</div>'+
        '<div class="mini">'+(h.emRisco?'Hoje ainda dá tempo de manter os '+h.sequencia+' dias.':h.sequencia===0&&h.melhor>0?'Recomeço — sua melhor sequência foi de '+h.melhor+' dias.':h.melhor>h.sequencia?'Melhor sequência: '+h.melhor+' dias.':'')+'</div>':'<div class="mini">Comece o check-in de hoje.</div>'),
    card('grimorio','grimorio.html','Grimório','<div class="num">'+p.grimorio.sequencia+' <small>dia'+(p.grimorio.sequencia===1?'':'s')+' de estudo</small></div><div class="mini">'+(p.grimorio.total?p.grimorio.total+' dias com registro':'Seu caderno de estudo e prática.')+'</div>'),
    card('rota','rota-internacional.html','Rota Internacional','<div class="num">'+p.rota.semana+' <small>de '+p.rota.meta+' candidaturas</small></div>'+barra(rotaPct)+delta(p.rota.semana,p.rota.anterior)+(p.rota.melhorSemana>p.rota.semana||p.rota.semanasMeta?'<div class="mini">'+(p.rota.semanasMeta?p.rota.semanasMeta+' semana'+(p.rota.semanasMeta===1?'':'s')+' seguida'+(p.rota.semanasMeta===1?'':'s')+' na meta · ':'')+'melhor semana: '+p.rota.melhorSemana+'</div>':'')),
    card('financeiro','financeiro.html','Financeiro','<div class="num">'+p.financeiro.pct+'% <small>da entrada</small></div>'+barra(p.financeiro.pct)+'<div class="mini">'+brl(p.financeiro.guardado)+' de '+brl(p.financeiro.meta)+'</div>'),
    card('desafios','desafios.html','Desafios',p.desafios.ativos||p.desafios.concluidos?'<div class="num">'+p.desafios.ativos+' <small>em andamento</small></div>'+barra(p.desafios.pct)+'<div class="mini">'+p.desafios.concluidos+' concluído'+(p.desafios.concluidos===1?'':'s')+(p.desafios.ativos&&p.desafios.hoje<p.desafios.ativos?' · falta marcar '+(p.desafios.ativos-p.desafios.hoje)+' hoje':'')+'</div>':'<div class="mini">Escolha um desafio curto para começar — dá para falhar dias e continuar.</div>'),
    card('mudanca','mudanca.html','Mudança','<div class="num">'+p.mudanca.pct+'% <small>do caminho</small></div>'+barra(p.mudanca.pct)+'<div class="mini">'+p.mudanca.imoveis+' imóvel(is) · '+p.mudanca.cotacoes+' orçamento(s) de mudança</div>')
  ];
  renderAgua(p);
  (function(){
    var l=[], r=p.refeicoes, hb=p.habitos, ds=p.desafios;
    if(r.hoje<6) l.push(['plano.html','🍽️',r.hoje?'Refeições: '+r.hoje+' de 6':'Marcar as refeições']);
    if(!hb.ativo||hb.feitosHoje<hb.totalHoje) l.push(['habitos.html','✅',hb.ativo?'Hábitos: '+hb.feitosHoje+' de '+hb.totalHoje:'Check-in de hábitos']);
    if(ds.ativos&&ds.hoje<ds.ativos) l.push(['desafios.html','🎯','Desafio: falta marcar hoje']);
    var el=$('#parahoje');
    if(!l.length){el.innerHTML='<div class="rotulo">Para hoje</div><div class="chips"><a class="ok" href="#">✓ Tudo em dia hoje</a></div>';return}
    el.innerHTML='<div class="rotulo">Para hoje · toque para ir</div><div class="chips">'+l.slice(0,3).map(function(x){return '<a href="'+x[0]+'"><span aria-hidden="true">'+x[1]+'</span>'+esc(x[2])+'</a>'}).join('')+'</div>';
  })();
  $('#cards').innerHTML=cards.join('');

  var feitos=p.marcos.filter(function(m){return m.ok}), faltam=p.marcos.filter(function(m){return !m.ok}).slice(0,4);
  $('#marcos').innerHTML=feitos.map(function(m){return '<span class="on">'+esc(m.nome)+'</span>'}).join('')+faltam.map(function(m){return '<span>'+esc(m.nome)+'</span>'}).join('');
}

function semanaAvaliada(dt){var d=new Date(dt.getFullYear(),dt.getMonth(),dt.getDate()),w=d.getDay(); if(w>2)return null; if(w!==0)d.setDate(d.getDate()-7); var seg=new Date(d); seg.setDate(seg.getDate()-((seg.getDay()+6)%7)); return CP_PROG.iso(seg)}
var QS=[['abrir','Tive vontade de abrir a Central?','nenhuma','muita'],['prazer','Foi agradável usar?','nada','muito'],['interesse','Ainda me interessa?','menos','mais']];
async function avaliacao(d){
  var id=semanaAvaliada(hoje); if(!id) return;
  if(d.avaliacoes.some(function(a){return a.id===id})) return;
  try{if(localStorage.getItem('cp-aval-dispensada')===id) return}catch(e){}
  var r={};
  var el=$('#aval');
  el.innerHTML='<section class="aval" aria-label="Avaliação da semana"><h3>Como foi a semana?</h3><div class="mini">Três perguntas, 20 segundos. Ajuda a ver se esta identidade continua funcionando para você.</div>'+
    QS.map(function(q){return '<div class="q" id="q-'+q[0]+'">'+esc(q[1])+'</div><div class="esc" role="group" aria-labelledby="q-'+q[0]+'">'+[1,2,3,4,5].map(function(n){return '<button type="button" data-q="'+q[0]+'" data-n="'+n+'" aria-pressed="false">'+n+'</button>'}).join('')+'</div><div class="ex"><span>1 = '+q[2]+'</span><span>5 = '+q[3]+'</span></div>'}).join('')+
    '<div class="acoes"><button class="btn" id="aval-ok" type="button" disabled>Salvar</button><button class="btn sec" id="aval-no" type="button">Agora não</button></div></section>';
  el.addEventListener('click',async function(e){
    var b=e.target.closest('button'); if(!b) return;
    if(b.dataset.q){r[b.dataset.q]=+b.dataset.n; el.querySelectorAll('[data-q="'+b.dataset.q+'"]').forEach(function(x){x.setAttribute('aria-pressed',x===b)}); $('#aval-ok').disabled=Object.keys(r).length<3}
    else if(b.id==='aval-no'){try{localStorage.setItem('cp-aval-dispensada',id)}catch(x){} el.innerHTML=''}
    else if(b.id==='aval-ok'){b.disabled=true; try{var db=await claude.use('db'); await db.doc('avaliacao/'+id).set({semana:id,abrir:r.abrir,prazer:r.prazer,interesse:r.interesse,tema:'lavanda',registradoEm:new Date().toISOString()}); el.innerHTML='<div class="aval"><b>Registrado.</b> <span class="mini">Obrigada — até a próxima semana.</span></div>'}catch(x){b.disabled=false;el.insertAdjacentHTML('beforeend','<div class="erro">Não consegui salvar agora. Tente de novo.</div>')}}
  });
}

var DADOS=null;
function litros(ml){return String(Math.round(ml/10)/100).replace('.',',')}
function hojeISO(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function renderAgua(p){
  var a=p.agua, msg, cls='';
  if(a.bateu){msg='Meta de 3 L batida 💧 Bom trabalho.';cls=' ok'}
  else if(a.bomHoje){msg='Dia bom ✓ (mais de 2,4 L). Faltam '+litros(a.meta-a.hoje)+' L para a meta.';cls=' ok'}
  else if(a.hoje===0){msg='Toque no copo ou na garrafa cada vez que beber.'}
  else{msg='Faltam '+litros(a.meta-a.hoje)+' L para a meta.'}
  var seq=a.sequencia?'<div class="msg">'+a.sequencia+' dia'+(a.sequencia===1?'':'s')+' seguidos acima de 2,4 L'+(a.melhor>a.sequencia?' · melhor: '+a.melhor:'')+(a.emRisco?' · hoje ainda dá tempo de manter':'')+'</div>':(a.melhor>0?'<div class="msg">Recomeço — sua melhor sequência foi de '+a.melhor+' dias.</div>':'');
  $('#agua').innerHTML='<div class="topo"><div><div class="rotulo">Água hoje</div><div class="big">'+litros(a.hoje)+' L <small>de 3 L</small></div></div></div>'+barra(a.pct)+'<div class="msg'+cls+'">'+msg+'</div>'+seq+
    '<div class="bts"><button type="button" data-ml="250">+ copo<br><small>250 ml</small></button><button type="button" class="pri" data-ml="500">+ garrafa<br><small>500 ml</small></button><button type="button" data-ml="-1">Outro valor</button></div>'+
    (a.hoje>0?'<button type="button" class="desf" data-desf="1">Desfazer o último</button>':'');
}
function aguaDoc(){var d=DADOS.agua.filter(function(x){return x.date===hojeISO()})[0];if(!d){d={date:hojeISO(),id:hojeISO(),ml:0,log:[]};DADOS.agua.push(d)}d.log=d.log||[];return d}
async function salvaAgua(d){try{var db=await claude.use('db');await db.doc('agua/'+d.date).set({date:d.date,ml:d.ml,log:d.log})}catch(e){console.error(e)}}
$('#agua').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b||!DADOS)return;
  var d=aguaDoc();
  if(b.dataset.desf){var u=d.log.pop();d.ml=Math.max(0,d.ml-(u||0))}
  else{var ml=+b.dataset.ml;if(ml<0){var v=prompt('Quantos ml você bebeu?','300');ml=Math.round(+String(v||'').replace(',','.'));if(!ml||ml<0||ml>3000)return}d.ml+=ml;d.log.push(ml)}
  CP_INT.mesclar(DADOS.habitos.records,DADOS.agua,[]);
  salvaAgua(d);render(CP_PROG.calcular(DADOS,new Date()));
});
carregar().then(function(d){DADOS=d;render(CP_PROG.calcular(d,new Date()));avaliacao(d)},function(e){
  console.error(e);$('#titulo').textContent='Não consegui carregar seus dados agora.';$('#erro').innerHTML='<div class="erro">Verifique a conexão e recarregue a página.</div>';
});
})();
</script>
</body>
</html>
