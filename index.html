<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="assets/tema.css">
<link rel="stylesheet" href="assets/modulos.css">
<link rel="stylesheet" href="assets/extras.css">
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<title>Central Pessoal</title>
<style>
.t{--mut:color-mix(in srgb,var(--t-muted) 62%,var(--t-ink));--lin:color-mix(in srgb,var(--t-line) 45%,var(--t-borda))}
*{box-sizing:border-box}
body{margin:0}
main{max-width:960px;margin:0 auto;padding:16px 16px 64px;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
header.top h1{font-size:22px}
.sp{flex:1}
.destaque{padding:20px}
.destaque h2{font-size:clamp(28px,7vw,40px);max-width:18ch}
.destaque p{margin:8px 0 0;color:var(--mut)}
.pr{display:flex;gap:12px;align-items:center;margin-top:16px;padding:12px 14px;background:var(--t-surface);border-left:4px solid var(--t-accent2);border:1px solid var(--lin);border-left-width:4px}
.selo{flex:none;width:38px;height:38px;display:grid;place-items:center;background:var(--t-accent2);color:#3B2A33;font:700 13px var(--f-mono)}
.pr b{font:600 17px var(--f-titulo)}
.pr small{display:block;color:var(--mut);font-size:13px}
h2.sec{font-size:13px;margin:30px 0 10px;color:var(--t-ink);font-weight:600}
.t .rotulo{font-weight:600}
.destaque .rotulo,.destaque p{color:var(--t-ink)!important}
.destaque p{opacity:.85}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
a.mod{display:flex;flex-direction:column;gap:10px;padding:16px;background:var(--t-surface);border:1px solid var(--lin);border-top:4px solid var(--m);color:inherit;text-decoration:none;border-radius:var(--raio)}
a.mod{box-shadow:0 1px 0 var(--lin)}
a.mod:hover{box-shadow:0 10px 24px -16px var(--m)}
/* menos informação: cada painel mostra o número principal e uma linha de apoio */
a.mod .sem,a.mod .up,a.mod .dn,a.mod .mini~.mini,a.mod .barra~.mini~.mini,.m-imovel .mini,.m-negocios .mini{display:none}
a.mod .cab{display:flex;align-items:center;gap:10px}
a.mod h3{font-size:19px}
a.mod .ic{width:34px;height:34px;flex:none}
a.mod .go{margin-left:auto;color:var(--mut);font-size:18px}
.num{font:600 30px/1 var(--f-titulo);letter-spacing:var(--titulo-tracking)}
.num small{font:500 13px var(--f-texto);color:var(--mut);letter-spacing:0}
.mini{font-size:13px;color:var(--mut)}
.up{color:var(--t-ok);font:500 12px var(--f-mono)}
.dn{color:var(--mut);font:500 12px var(--f-mono)}
.barra{height:8px;background:var(--lin);overflow:hidden}
.barra i{display:block;height:100%;background:var(--t-ok)}
@media (prefers-reduced-motion:no-preference){.barra i{animation:cresce .9s ease-out}@keyframes cresce{from{width:0}}}
.sem{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.sem div{height:22px;border:1px solid var(--lin);font:500 10px/20px var(--f-mono);text-align:center;color:var(--mut)}
.sem div.f{background:color-mix(in srgb,var(--t-ok) 22%,var(--t-surface));border-color:var(--t-ok);color:var(--t-ink)}
.sem div.h{border-color:var(--t-accent);color:var(--t-accent);font-weight:700}
.sem div.p{border-style:dashed;border-color:var(--t-borda);background:repeating-linear-gradient(45deg,var(--t-realce) 0 4px,transparent 4px 8px);color:var(--t-ink)}
.aval{margin-top:16px;padding:16px;background:var(--t-surface);border:1px solid var(--lin);border-left:4px solid var(--t-accent)}
.aval h3{font-size:18px;margin-bottom:4px}
.aval .q{margin:12px 0 4px;font-size:14px}
.aval .esc{display:flex;gap:6px}
.aval .esc button{flex:1;min-height:44px;font:600 15px var(--f-texto);border:1px solid var(--t-borda);background:var(--t-bg);color:var(--t-ink);border-radius:var(--raio);cursor:pointer}
.aval .esc button[aria-pressed=true]{background:var(--t-accent);border-color:var(--t-accent);color:var(--t-accent-ink)}
.aval .ex{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:2px}
.aval .acoes{display:flex;gap:8px;margin-top:14px}
.aval .btn{font:600 14px var(--f-texto);padding:10px 16px;border-radius:var(--raio);border:1px solid var(--t-accent);background:var(--t-accent);color:var(--t-accent-ink);cursor:pointer;min-height:44px}
.aval .btn.sec{background:transparent;color:var(--t-accent)}
.marcos{display:flex;gap:8px;flex-wrap:wrap}
.marcos span{font:500 12px var(--f-mono);padding:7px 11px;border:1px solid var(--lin);background:var(--t-surface);color:var(--mut)}
.marcos span.on{border-color:var(--t-ok);color:var(--t-ink);background:color-mix(in srgb,var(--t-ok) 16%,var(--t-surface))}
.marcos span.on::before{content:"✓ ";color:var(--t-ok);font-weight:700}
.erro{padding:14px;border:1px solid var(--t-bad);color:var(--t-bad);margin-top:12px}

.gastos{margin-top:12px;padding:14px 16px;background:var(--t-surface);border:1px solid var(--lin);border-left:4px solid var(--t-accent);display:block}
.gastos a.cab{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;color:inherit;text-decoration:none}
.gastos .big{font:600 28px var(--f-titulo);letter-spacing:var(--titulo-tracking)}
.gastos .big small{font:400 15px var(--f-texto);color:var(--mut)}
.gastos .sub{font-size:13px;color:var(--mut);margin-top:2px}
.gastos .lin{margin-top:12px;display:block;color:inherit;text-decoration:none}
.gastos .ver{display:block;margin-top:14px;font-size:14px;font-weight:600;color:var(--t-accent);text-decoration:none}
.gastos .lin .l{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.gastos .lin .l b{font-weight:600}
.gastos .lin .barra{margin-top:4px}
.gastos .lin .barra i{background:var(--t-ok)}
.gastos .lin.atencao .barra i{background:var(--t-accent2)}
.gastos .lin.estourou .barra i{background:var(--t-bad)}
.gastos .lin.estourou .v{color:var(--t-bad);font-weight:600}
.gastos .vazio{font-size:14px;color:var(--mut);margin-top:8px}
.agua{margin-top:12px;padding:14px 16px;background:var(--t-surface);border:1px solid var(--lin);border-left:4px solid var(--t-c3)}
.agua .topo{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.agua .big{font:600 28px var(--f-titulo);letter-spacing:var(--titulo-tracking)}
.agua .big small{font:400 15px var(--f-texto);color:var(--mut)}
.agua .msg{font-size:14px;color:var(--mut);margin-top:6px}
.agua .msg.ok{color:var(--t-ok);font-weight:600}
.agua .bts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.agua .bts button{font:600 15px var(--f-texto);min-height:52px;border:1px solid var(--t-c3);background:transparent;color:var(--t-ink);cursor:pointer;border-radius:var(--raio)}
.agua .bts button.pri{background:var(--t-c3);color:var(--t-bg)}
.agua .desf{margin-top:8px;font:500 13px var(--f-texto);min-height:40px;border:0;background:none;color:var(--mut);text-decoration:underline;cursor:pointer}

.parahoje{margin-top:12px}
.parahoje .rotulo{margin-bottom:6px}
.parahoje .chips{display:flex;gap:8px;flex-wrap:wrap}
.parahoje a{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border:1px solid var(--t-borda);background:var(--t-surface);color:var(--t-ink);text-decoration:none;font:600 14px var(--f-texto);border-radius:var(--raio)}
.parahoje a.ok{border-color:var(--t-ok);color:var(--t-ok)}

@media (max-width:700px){
.grid{grid-template-columns:1fr 1fr;gap:10px}
a.mod{min-height:0;padding:12px;gap:8px}
a.mod h3{font-size:16px}
a.mod .ic{width:28px;height:28px}
a.mod .go,a.mod .sem,a.mod .mini,a.mod .up,a.mod .dn{display:none}
.num{font-size:24px}
.num small{display:block;margin-top:2px}
}
.marcos-btn{margin-top:14px;display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1px solid var(--t-borda);background:var(--t-surface);color:var(--t-ink);font:600 14px var(--f-texto);border-radius:var(--raio);cursor:pointer;max-width:100%;text-align:left}
.marcos-btn[hidden]{display:none}
#marcosDlg{width:min(560px,calc(100vw - 32px));max-height:80vh;overflow:auto;border:1px solid var(--lin);border-radius:var(--raio);background:var(--t-bg);color:var(--t-ink);padding:18px}
#marcosDlg::backdrop{background:rgba(30,20,50,.35)}
#marcosDlg h3{font:600 20px var(--f-titulo);margin:0 0 12px}
#marcosDlg .fechar{margin-top:16px;width:100%;min-height:48px;border:1px solid var(--t-borda);background:var(--t-surface);color:var(--t-ink);font:600 15px var(--f-texto);border-radius:var(--raio);cursor:pointer}
.hoje-lista{display:grid;gap:8px}
a.lin{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 14px;background:var(--t-surface);border:1px solid var(--lin);border-left:4px solid var(--t-borda);border-radius:var(--raio);color:inherit;text-decoration:none}
a.lin.ok{border-left-color:var(--t-ok)}
a.lin .ico{font-size:22px;flex:none}
a.lin .tx{flex:1;min-width:0}
a.lin b{display:block;font:600 16px var(--f-texto)}
a.lin small{display:block;color:var(--mut);font-size:13px}
a.lin .go{color:var(--mut);font-size:18px}
.habhoje .cap{font:500 12px var(--f-mono);color:var(--mut);margin:10px 0 6px;text-transform:uppercase;letter-spacing:.04em}
.hab{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 14px;background:var(--t-surface);border:1px solid var(--lin);border-radius:var(--raio);margin-bottom:8px}
.hab.ok{border-color:var(--t-ok);background:color-mix(in srgb,var(--t-ok) 10%,var(--t-surface))}
.hab .tx{flex:1;min-width:0}
.hab b{display:block;font:600 15px var(--f-texto)}
.hab small{display:block;color:var(--mut);font-size:13px}
.hab button{flex:none;min-width:52px;height:52px;border-radius:26px;border:2px solid var(--t-borda);background:var(--t-bg);color:var(--t-ink);font:700 22px var(--f-texto);cursor:pointer}
.hab button.on{background:var(--t-ok);border-color:var(--t-ok);color:var(--t-bg)}
.hab .qt{display:flex;align-items:center;gap:8px}
.hab .qt span{min-width:44px;text-align:center;font:600 16px var(--f-mono)}
.hab .vazio{font-size:14px;color:var(--mut)}
.foco{margin-top:12px;padding:16px;background:var(--t-surface);border:1px solid var(--lin);border-left:4px solid var(--t-accent);border-radius:var(--raio)}
.foco .rotulo{margin-bottom:6px}
.foco-txt{font:600 20px/1.3 var(--f-titulo);margin-bottom:6px}
.foco-feito b{display:block;font:600 18px var(--f-titulo);color:var(--t-ok)}
.foco-feito small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.foco .acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.foco .btn{font:600 15px var(--f-texto);min-height:44px;padding:0 16px;border-radius:var(--raio);border:1px solid var(--t-accent);background:var(--t-accent);color:var(--t-accent-ink);cursor:pointer}
.foco .btn.sec{background:transparent;color:var(--t-accent)}
.foco input{font:inherit;font-size:16px;min-height:46px;padding:0 12px;border:1px solid var(--t-borda);background:var(--t-bg);color:var(--t-ink);border-radius:var(--raio);width:100%;min-width:0}
.foco-lin,.foco-passo,.cap{display:flex;gap:8px;margin-top:6px}
.foco .cap{margin-top:14px;padding-top:12px;border-top:1px solid var(--lin)}
.foco .lk{min-height:44px;padding:0 4px;border:0;background:none;color:var(--t-accent);font:600 14px var(--f-texto);text-decoration:underline;cursor:pointer}
.foco .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.foco .chip{min-height:44px;max-width:100%;padding:6px 12px;border:1px solid var(--t-borda);background:var(--t-bg);color:var(--t-ink);font:500 14px var(--f-texto);border-radius:var(--raio);cursor:pointer;text-align:left}
.foco .caps{margin-top:8px;font-size:14px}
.foco .caps summary{min-height:44px;display:flex;align-items:center;cursor:pointer;color:var(--mut)}
.cap-it{display:flex;align-items:center;gap:4px;border-top:1px solid var(--lin)}
.cap-it span{flex:1;min-width:0;padding:8px 0;overflow-wrap:anywhere}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.metas-d>summary{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px;padding:0 16px;background:var(--t-surface);border:1px solid var(--lin);border-radius:var(--raio);cursor:pointer;font-size:16px;list-style:none;margin-bottom:12px}
.metas-d>summary::-webkit-details-marker{display:none}
.metas-d>summary span{font:600 13px var(--f-mono);color:var(--t-accent)}
.metas-d[open]>summary span{display:none}
.metas-g{background:var(--t-surface);border:1px solid var(--lin);border-radius:var(--raio);padding:6px 14px 8px;margin-bottom:12px}
.metas-g.saude{border-top:4px solid var(--t-ok)}
.metas-g.vida{border-top:4px solid var(--t-accent)}
.metas-g h3{font:600 17px var(--f-titulo);margin:10px 0 2px}
a.meta{display:block;padding:10px 0;color:inherit;text-decoration:none;min-height:48px}
a.meta+a.meta{border-top:1px solid var(--lin)}
a.meta .l{display:flex;justify-content:space-between;gap:10px;font-size:15px;margin-bottom:6px}
a.meta .l span:last-child{font:500 13px var(--f-mono);color:var(--mut);white-space:nowrap}
a.meta.ok .l span:last-child{color:var(--t-ok);font-weight:700}

/* home enxuta: topo curto, rotina recolhida e módulos agrupados em áreas */
header.top .marcos-btn{margin:0;min-height:40px;padding:0 12px;font-size:13px;white-space:nowrap}
.destaque{padding:16px 18px}
.destaque h2{font-size:clamp(24px,6vw,32px)}
.destaque p{margin-top:6px}
.habs-d{margin-top:12px}
.habs-d>summary,.area>summary{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px;padding:6px 16px;background:var(--t-surface);border:1px solid var(--lin);border-radius:var(--raio);cursor:pointer;font-size:16px;list-style:none}
.habs-d>summary::-webkit-details-marker,.area>summary::-webkit-details-marker{display:none}
.habs-d>summary span{font:600 13px var(--f-mono);color:var(--t-accent);white-space:nowrap}
.habs-d[open]>summary,.area[open]>summary{margin-bottom:10px}
.area{margin-bottom:10px}
.area>summary .nm{display:block;font:600 18px var(--f-titulo)}
.area>summary .ht{display:block;font-size:13px;color:var(--mut);margin-top:2px;overflow-wrap:anywhere}
.area>summary::after{content:"›";flex:none;color:var(--mut);font-size:22px;transition:transform .15s}
.area[open]>summary::after{transform:rotate(90deg)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-bottom:6px}
@media (min-width:700px){.tiles{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}}
a.tile{display:flex;align-items:center;gap:10px;min-height:64px;padding:10px 12px;background:var(--t-surface);border:1px solid var(--lin);border-left:4px solid var(--m);border-radius:var(--raio);color:inherit;text-decoration:none}
a.tile .ic{width:26px;height:26px;flex:none}
a.tile b{display:block;font:600 15px var(--f-texto)}
a.tile small{display:block;color:var(--mut);font-size:12.5px;line-height:1.3}
.parahoje{margin-top:12px}
.agua .big{font-size:24px}
.parahoje a{max-width:100%}
.parahoje a .tx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
<link rel="stylesheet" href="assets/mobile.css">
</head>
<body class="t">
<main>
  <header class="top">
    <svg class="marca" width="40" height="40" viewBox="0 0 48 48" aria-hidden="true"><use href="#marca"/></svg>
    <div><h1>Central Pessoal</h1><div class="rotulo" id="data"></div></div>
    <span class="sp"></span>
    <button type="button" class="marcos-btn" id="marcosBtn" aria-haspopup="dialog" hidden></button>
  </header>

  <section class="destaque" aria-live="polite">
    <h2 id="titulo">Carregando…</h2>
    <p id="sub"></p>
    <div id="pr"></div>
  </section>

  <div class="parahoje" id="parahoje"></div>

  <section class="foco" id="foco" aria-label="Foco de hoje"></section>

  <section class="gastos" id="gastos" aria-label="Gastos da semana e do mês"></section>

  <section class="agua" id="agua" aria-label="Água de hoje"></section>

  <details class="habs-d" id="habsD">
    <summary><b>Hábitos de hoje</b><span id="habsRes"></span></summary>
    <div class="habhoje" id="habhoje"></div>
  </details>

  <h2 class="sec rotulo">Áreas</h2>
  <div id="areas"></div>

  <h2 class="sec rotulo">Metas da semana</h2>
  <div id="metas"></div>

  <div id="aval"></div>

  <dialog id="marcosDlg" aria-label="Marcos">
    <h3>Marcos</h3>
    <div class="marcos" id="marcos"></div>
    <button type="button" class="fechar" id="marcosFechar">Fechar</button>
  </dialog>
  <div id="erro"></div>
</main>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <g id="marca"><rect class="p1" x="4" y="4" width="28" height="28"/><rect class="p2" x="16" y="16" width="28" height="28"/><rect class="x" x="16" y="16" width="16" height="16"/><path class="c" d="M16 32A16 16 0 0 1 32 16V32Z"/></g></defs></svg>

<script src="assets/cert.js"></script>
<script src="assets/pdi.js"></script>
<script src="assets/ingles.js?v=20261106"></script>
<script src="assets/imovel-acomp.js"></script>
<script src="assets/plat.js"></script>
<script src="assets/esp.js"></script>
<script src="assets/pluggy-fin.js?v=1"></script>
<script src="assets/gastos.js?v=1"></script>
<script src="assets/progresso.js?v=20261106"></script>
<script src="assets/integracoes.js"></script>
<script src="assets/foco.js"></script>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function brl(n){return 'R$ '+Math.round(n).toLocaleString('pt-BR')}
function barra(p){return '<div class="barra" role="progressbar" aria-valuenow="'+p+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+Math.max(0,Math.min(100,p))+'%"></i></div>'}
function delta(a,b){var d=a-b;return d>0?'<span class="up">▲ +'+d+' vs. semana passada</span>':d<0?'<span class="dn">▼ '+d+' vs. semana passada</span>':'<span class="dn">= semana passada</span>'}

var hoje=new Date();
$('#data').textContent=hoje.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});

function json(r){try{return r&&r.value?JSON.parse(r.value):null}catch(e){return null}}
function docs(s){return s.docs.map(function(d){var o=d.data();o.id=d.id;return o})}
var falhas=0;
function seguro(p,v){return p.then(function(x){return x},function(){falhas++;return v})}

async function carregar(){
  var db=await claude.use('db'), st=window.storage;
  var r=await Promise.all([
    seguro(db.collection('sessions').get().then(docs),[]),
    seguro(st.get('config'),null), seguro(st.get('records'),null),
    seguro(st.get('grimorio_entries'),null),
    seguro(db.collection('apps').get().then(docs),[]), seguro(db.doc('profile/main').get().then(function(s){return s.exists?s.data():{}}),{}),
    seguro(db.collection('medidas').get().then(docs),[]),
    seguro(db.doc('fin/base').get().then(function(s){return s.exists?s.data():{}}),{}), seguro(st.get('investEntries'),null),
    seguro(db.collection('mud_imoveis').get().then(docs),[]), seguro(db.collection('mud_cotacoes').get().then(docs),[]),
    seguro(db.doc('mud_checklist/main').get().then(function(s){return s.exists?s.data():{}}),{}), seguro(db.doc('mud_config/main').get().then(function(s){return s.exists?s.data():{}}),{}),
    seguro(fetch('assets/exercicios.json').then(function(x){return x.json()}),{}),
    seguro(db.collection('avaliacao').get().then(docs),[]),

function marcaHabito(id,acao){
  var x=(P.habitos.lista||[]).filter(function(h){return h.id===id})[0]; if(!x)return;
  var dia=hojeISO();
  function aplica(r){
    r=r||{};
    if(x.kind==='boolean'){ if(acao==='t'){ if(r[id])delete r[id]; else r[id]=true } }
    else{ var v=Math.round(((+r[id]||0)+(acao==='inc'?1:-1)*x.step)*100)/100; if(v<=0)delete r[id]; else r[id]=v }
    return r;
  }
  // tela atualiza na hora; o banco recebe depois, na ordem dos toques
  var rec=DADOS.habitos.records, r=aplica(Object.assign({},rec[dia]));
  if(Object.keys(r).length)rec[dia]=r; else delete rec[dia];
  render(CP_PROG.calcular(DADOS,new Date()));
  fila=fila.then(async function(){
    try{
      var raw=json(await window.storage.get('records'))||{}, rr=aplica(raw[dia]);
      if(Object.keys(rr).length)raw[dia]=rr; else delete raw[dia];
      await window.storage.set('records',JSON.stringify(raw),false);
    }catch(e){console.error('hábito não salvou',e)}
  });
}

function aguaDoc(){var d=DADOS.agua.filter(function(x){return x.date===hojeISO()})[0];if(!d){d={date:hojeISO(),id:hojeISO(),ml:0,log:[]};DADOS.agua.push(d)}d.log=d.log||[];return d}
async function salvaAgua(d){try{var db=await claude.use('db');await db.doc('agua/'+d.date).set({date:d.date,ml:d.ml,log:d.log})}catch(e){console.error(e)}}
$('#marcosBtn').addEventListener('click',function(){var d=$('#marcosDlg');if(d.showModal)d.showModal();else d.setAttribute('open','')});
$('#marcosFechar').addEventListener('click',function(){$('#marcosDlg').close()});
$('#marcosDlg').addEventListener('click',function(e){if(e.target===this)this.close()});
$('#agua').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b||!DADOS)return;
  var d=aguaDoc();
  if(b.dataset.desf){var u=d.log.pop();d.ml=Math.max(0,d.ml-(u||0))}
  else{var ml=+b.dataset.ml;if(ml<0){var v=prompt('Quantos ml você bebeu?','300');ml=Math.round(+String(v||'').replace(',','.'));if(!ml||ml<0||ml>3000)return}d.ml+=ml;d.log.push(ml)}
  CP_INT.mesclar(DADOS.habitos.records,DADOS.agua,[]);
  salvaAgua(d);render(CP_PROG.calcular(DADOS,new Date()));
});

/* lembra o que ficou aberto */
document.addEventListener('toggle',function(e){
  var d=e.target;if(!d||!d.matches)return;
  try{
    if(d.matches('#areas .area')){var o=JSON.parse(localStorage.getItem('cp-areas')||'{}');o[d.dataset.a]=d.open;localStorage.setItem('cp-areas',JSON.stringify(o))}
    else if(d.id==='habsD')localStorage.setItem('cp-habs',d.open?'1':'0');
  }catch(x){}
},true);
try{if(localStorage.getItem('cp-habs')==='1')$('#habsD').open=true}catch(e){}
$('#parahoje').addEventListener('click',function(e){var a=e.target.closest('a[data-aqui="1"]');if(!a)return;e.preventDefault();var d=$('#habsD');d.open=true;d.scrollIntoView({behavior:'smooth',block:'start'})});
carregar().then(function(d){DADOS=d;
  CP_FOCO.init({dados:function(){return DADOS},db:function(){return claude.use('db')},calc:function(){return P},refresh:function(){render(CP_PROG.calcular(DADOS,new Date()))}},$('#foco'));
  render(CP_PROG.calcular(d,new Date()));avaliacao(d)},function(e){
  console.error(e);$('#titulo').textContent='Não consegui carregar seus dados agora.';$('#erro').innerHTML='<div class="erro">Verifique a conexão e recarregue a página.</div>';
});
})();
</script>
