.tag.ruim{background:color-mix(in srgb,var(--t-bad) 16%,var(--t-surface));border-color:var(--t-bad)}
.tag.no{opacity:.55;text-decoration:line-through}
.barra{height:8px;background:var(--t-line);overflow:hidden}
.barra i{display:block;height:100%;background:var(--t-ok)}
.aviso{border-left:4px solid var(--t-accent2);background:color-mix(in srgb,var(--t-accent2) 12%,var(--t-surface));padding:12px 14px;margin-bottom:12px;font-size:14px}
.aviso.ruim{border-left-color:var(--t-bad);background:color-mix(in srgb,var(--t-bad) 9%,var(--t-surface))}

.kv b{white-space:nowrap}

<script>
(function(){
'use strict';
var db=null, S={perfil:null,cap:null,constr:[],imv:[],plano:{done:{},extra:[]},estr:{}};
var $=function(s,r){return (r||document).querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(v){var s=String(v==null?'':v).trim();if(/,/.test(s))s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');var n=parseFloat(s);return isNaN(n)?0:n}
function brl(n){return (n<0?'−':'')+'R$ '+Math.round(Math.abs(n)).toLocaleString('pt-BR')}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function dataBR(d){return d?String(d).split('-').reverse().join('/'):''}
function barra(p){p=Math.max(0,Math.min(100,p));return '<div class="barra" role="progressbar" aria-valuenow="'+p+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+p+'%"></i></div>'}
function ehMRV(t){return /\bmrv\b/i.test(t||'')}

/* ---------- 1. Perfil: ficha com status de cada informação ---------- */
var ST_INFO={confirmado:'Confirmado',estimativa:'Estimativa',preferencia:'Preferência',desconhecido:'A descobrir'};
var PERFIL_PADRAO=[
 ['Capacidade financeira',[
  ['renda','Renda bruta mensal','R$ 6.500','estimativa','Banco não aceita automaticamente a renda bruta: depende da comprovação.'],
  ['vinculo','Como recebe','MEI há 3 anos, por nota fiscal; renda de R$ 4 mil (outro cliente) passou a R$ 6.500 há 1 ano, com a empresa atual, única; relação de trabalho na prática "PJ pejotizado" (via Cora)','confirmado','Risco: concentração em um cliente e só 1 ano na renda atual (3 anos de MEI ajudam). Teto do MEI: R$ 81 mil/ano (R$ 6.500 × 12 = R$ 78 mil, mais o bônus de ago/2026).'],
  ['comprovacao','Como comprova renda','Declara IR; notas fiscais e extratos Cora','estimativa','Confirmar com a CAIXA o que aceita de MEI: DASN-SIMEI, IR, extratos, notas fiscais.'],
  ['fgts','FGTS disponível','R$ 0','estimativa',''],
  ['entrada','Entrada disponível hoje','≈ R$ 10.000','estimativa','Hoje é quase todo Tesouro Selic — também é a única reserva de emergência.'],
  ['sobra','Sobra mensal real','','desconhecido','Dito antes: pouco mais de R$ 1.000. Extratos de abr–set/2026 mostram saldo livre negativo (ver "Quanto cabe").'],
  ['dividas','Dívidas e parcelas existentes','','desconhecido',''],
  ['parcela','Parcela confortável / limite / perigosa','','desconhecido','A simulação de R$ 1.950 NÃO é adequação financeira confirmada.']]],
 ['Imóvel desejado',[
  ['tipo','Casa ou apartamento','Prefere casa; aceita apartamento (principal motivo contra: condomínio)','confirmado',''],
  ['condominio','Tolerância a condomínio','Preferência, não restrição: apartamento com condomínio é aceito; teto ~R$ 400/mês','confirmado','Condomínio entra na conta mensal junto com parcela e IPTU.'],
  ['novo','Novo, usado ou ambos','Quer imóvel novo (não aceita usado)','confirmado','Restringe a pesquisa a construtoras/incorporadoras; reavaliar só se a conta não fechar.'],
  ['quartos','Quartos / banheiros / vaga','2 quartos (preferência); vaga: a definir','preferencia','Pretende comprar carro no futuro.'],
  ['area','Área mínima e home office','Trabalha na maior parte do tempo de casa','confirmado','O segundo quarto pode servir de escritório.'],
  ['reforma','Tolerância a reforma','','desconhecido','']]],
 ['Localização e rotina',[
  ['cidade','Cidades','Fortaleza (prefere), Eusébio e Maracanaú','confirmado','Caucaia e Aquiraz não foram citados na última resposta.'],
  ['bairros','Bairros preferidos / a evitar','Evitar bairros mais perigosos (ex.: Granja Lisboa, Barroso)','confirmado',''],
  ['desloc','Deslocamento aceitável (trabalho, família)','Trabalha de casa; deslocamento diário pesa pouco','estimativa','Confirmar família/locais frequentes.'],
  ['transp','Carro, moto ou transporte público','Hoje sem carro; pretende comprar no futuro','estimativa','']]],
 ['Objetivo e risco',[
  ['horizonte','Comprar logo ou pode esperar','Preocupada com o tamanho da entrada','preferencia',''],
  ['permanencia','Morar por quantos anos / revenda','','desconhecido',''],
  ['planta','Tolerância a obra na planta e atrasos','Prefere obra avançada ou imóvel pronto; evita planta de longo prazo','confirmado','Foco da pesquisa: unidades prontas, remanescentes e obras em fase final.'],
  ['outras','Metas que a compra não pode atrapalhar','','desconhecido','Ex.: vaga internacional, graduação, inglês.'],
  ['excluidas','Construtoras excluídas','MRV (definitivo)','confirmado','']]]
];
function perfilBase(){var o={};PERFIL_PADRAO.forEach(function(g){g[1].forEach(function(c){o[c[0]]={v:c[2],s:c[3]}})});return o}
function perfilVal(k){var p=S.perfil||perfilBase();return p[k]||{v:'',s:'desconhecido'}}

function rPerfil(){
  var P=S.perfil||perfilBase(),tot=0,conf=0,desc=0;
  PERFIL_PADRAO.forEach(function(g){g[1].forEach(function(c){tot++;var s=(P[c[0]]||{}).s;if(s==='confirmado')conf++;if(s==='desconhecido'||!(P[c[0]]||{}).v)desc++})});
  var h='<div class="aviso"><b>Como usar:</b> preencha e marque cada item como <i>confirmado</i>, <i>estimativa</i>, <i>preferência</i> ou <i>a descobrir</i>. Nada aqui é tratado como fato até você confirmar. A MRV está fora de qualquer recomendação.</div>';
  h+='<div class="grid"><div class="cartao"><div class="rotulo">Ficha</div><div class="big">'+conf+'/'+tot+'</div><div class="mini">itens confirmados · '+desc+' ainda a descobrir</div>'+barra(Math.round(conf/tot*100))+'</div>'+
     '<div class="cartao"><div class="rotulo">Critério</div><div style="margin-top:6px;font-size:14px">Maximizar a <b>adequação à sua vida</b>, não o valor do imóvel nem a maior parcela que o banco aceitar.</div></div></div>';
  PERFIL_PADRAO.forEach(function(g){
    h+='<div class="cartao"><h3>'+esc(g[0])+'</h3>'+g[1].map(function(c){var x=P[c[0]]||{v:'',s:'desconhecido'};
      return '<div class="item" style="flex-wrap:wrap"><div style="flex:1;min-width:200px"><div class="mini">'+esc(c[1])+'</div><div>'+(x.v?esc(x.v):'<span class="mini">— não preenchido</span>')+'</div>'+(c[4]?'<div class="mini">'+esc(c[4])+'</div>':'')+'</div>'+
        '<span class="tag'+(x.s==='confirmado'?' ok':'')+'">'+esc(ST_INFO[x.s]||'')+'</span><button class="btn sec" data-pf="'+c[0]+'">Editar</button></div>'}).join('')+'</div>';
  });
  $('#perfil').innerHTML=h;
}

/* ---------- 2. Quanto cabe ---------- */
var CAP_PADRAO={renda:'6500',aluguel:'1329.80',sobra:'0',reserva:'0',entrada:'10000',preco:'200000',prazo:'360',juros:'8.16',sist:'price',extra:'0.05',custos:'5',inicial:'6000',cond:'0',iptu:'0',pctOk:'25',pctMax:'30'};
function cap(){var c=S.cap||CAP_PADRAO,o={};Object.keys(CAP_PADRAO).forEach(function(k){o[k]=c[k]!=null?c[k]:CAP_PADRAO[k]});return o}
function parcelaPrice(pv,i,n){if(pv<=0||n<=0)return 0;return i?pv*i/(1-Math.pow(1+i,-n)):pv/n}
function calcImovel(preco,entrada,c){
  var pv=Math.max(0,preco-entrada),i=num(c.juros)/100/12,n=Math.round(num(c.prazo))||360,sac=c.sist==='sac';
  var base=sac?pv/n+pv*i:parcelaPrice(pv,i,n);          // 1ª prestação
  var tx=pv*num(c.extra)/100;                            // seguros + tarifa mensal (estimativa)
  var mensal=base+tx+num(c.cond)+num(c.iptu);
  var custos=preco*num(c.custos)/100;
  return {fin:pv,parc:base+tx,mensal:mensal,custos:custos,comecar:entrada,ate:entrada+custos+num(c.inicial),
          total:(sac?(pv/n*n+pv*i*(n+1)/2):base*n)+tx*n+custos,pctFin:preco?pv/preco*100:0};
}
var MEDIA_NEG=-751; // média do saldo livre abr–set/2026 em dados/financeiro-base.json (renda 6.500, inclui aluguel)
function rCapacidade(){
  var c=cap(),renda=num(c.renda),preco=num(c.preco),ent=num(c.entrada),r=calcImovel(preco,ent,c);
  var ok=renda*num(c.pctOk)/100,mx=renda*num(c.pctMax)/100,alug=num(c.aluguel),
      acrescimo=r.mensal-alug,sobra=num(c.sobra);
  var nivel=r.mensal<=ok?['ok','Confortável']:r.mensal<=mx?['','No limite']:['ruim','Perigosa'];
  var reservaPos=num(c.reserva)+ent-r.ate; // dinheiro total (reserva separada + entrada) menos o necessário até as chaves
  var h='<div class="aviso ruim"><b>Atenção aos seus extratos.</b> De abril a setembro/2026 o saldo livre ficou negativo todos os meses (média ≈ '+brl(MEDIA_NEG)+'/mês, mesmo com bônus em agosto). Antes de qualquer parcela, vale confirmar a "sobra de R$ 1.000" — a conta abaixo usa o campo <i>Sobra mensal real</i>. Fonte: <code>dados/financeiro-base.json</code>.</div>';
  h+='<div class="cartao"><h3>Premissas <span class="mini">(edite; salva sozinho)</span></h3><div class="cal" style="margin-top:10px">'+
   F('renda','Renda comprovável (R$/mês)')+F('aluguel','Aluguel atual (R$/mês)')+F('sobra','Sobra mensal real (R$)')+F('reserva','Reserva de emergência à parte (R$)')+
   F('entrada','Entrada disponível (R$)')+F('preco','Preço do imóvel (R$)')+F('prazo','Prazo (meses)')+F('juros','Juros nominais (% a.a.)')+
   '<label>Sistema<select data-cap="sist"><option value="price"'+(c.sist==='price'?' selected':'')+'>Price (parcela fixa)</option><option value="sac"'+(c.sist==='sac'?' selected':'')+'>SAC (1ª parcela maior)</option></select></label>'+
   F('extra','Seguros+tarifa (% do saldo/mês)')+F('custos','ITBI, escritura e registro (% do preço)')+F('inicial','Mudança, reforma e móveis (R$)')+F('cond','Condomínio (R$/mês)')+F('iptu','IPTU (R$/mês)')+F('pctOk','Parcela confortável (% da renda)')+F('pctMax','Limite (% da renda)')+
   '</div><div class="mini" style="margin-top:8px">Seguros e tarifa são estimativa; juros e taxas reais só vêm da simulação/proposta da Caixa ou de outro banco.</div></div>';
  h+='<div class="grid"><div class="cartao"><div class="rotulo">Prestação + moradia</div><div class="big">'+brl(r.mensal)+'</div><span class="tag '+nivel[0]+'">'+nivel[1]+'</span>'+
     '<div class="mini" style="margin-top:6px">'+(renda?Math.round(r.mensal/renda*100):0)+'% da renda · confortável até '+brl(ok)+' · limite '+brl(mx)+'</div></div>'+
     '<div class="cartao"><div class="rotulo">Muda no seu caixa</div><div class="big" style="color:'+(acrescimo>0?'var(--t-bad)':'var(--t-ok)')+'">'+(acrescimo>0?'+':'')+brl(acrescimo)+'</div><div class="mini">por mês vs. o aluguel de '+brl(alug)+'. '+(sobra>=acrescimo?'Cabe na sobra informada ('+brl(sobra)+').':'<b>Não cabe</b> na sobra informada ('+brl(sobra)+').')+'</div></div></div>';
  h+='<div class="cartao"><h3>Os três valores</h3>'+
     kv('1 · Para começar a negociação',brl(r.comecar),'a entrada que você tem')+
     kv('2 · Total até receber as chaves',brl(r.ate),'entrada + '+brl(r.custos)+' de custos + '+brl(num(c.inicial))+' de mudança/reforma')+
     kv('3 · Custo total (financiamento + custos)',brl(r.total),'em '+Math.round(num(c.prazo))+' meses, sem correção monetária — estimativa')+
     kv('Valor financiado',brl(r.fin),Math.round(r.pctFin)+'% do preço')+
     kv('Reserva que sobra após a compra',brl(reservaPos),reservaPos<0?'faltam recursos para fechar':reservaPos<num(c.renda)*3?'abaixo de 3 meses de renda':'')+'</div>';
  if(reservaPos<0)h+='<div class="aviso ruim">Com estes números o dinheiro não fecha: faltam <b>'+brl(-reservaPos)+'</b> até as chaves. Veja as estratégias de reduzir o preço, parcelar a entrada ou esperar.</div>';
  h+='<div class="cartao"><h3>Teto por parcela</h3><div class="mini" style="margin:4px 0 8px">Quanto de imóvel cada limite de moradia compra (com as premissas acima, sem condomínio/IPTU).</div>'+
     [ok,mx,Math.min(mx,alug+Math.max(sobra,0))].map(function(m,ix){var i=num(c.juros)/100/12,n=Math.round(num(c.prazo))||360;
       var pv=Math.max(0,(m-num(c.cond)-num(c.iptu)))/(i?i/(1-Math.pow(1+i,-n)):1/n)/(1+num(c.extra)/100/(i?i/(1-Math.pow(1+i,-n)):1/n));
       return kv(['Parcela confortável','Parcela no limite','Aluguel + sobra real'][ix]+' ('+brl(m)+')','financia ≈ '+brl(pv),'imóvel ≈ '+brl(pv+ent)+' com a entrada atual')}).join('')+
     '</div>';
  h+='<div class="cartao"><h3>Referência de programas <span class="tag">consultado 26/10/2026</span></h3>'+
     '<div class="mini">Fontes secundárias (blogs/portais) — <b>não encontrei o texto oficial</b>; confirme na CAIXA e no Ministério das Cidades antes de decidir.</div>'+
     '<ul class="l"><li>Minha Casa, Minha Vida (Portaria MCID nº 333/2026, segundo as fontes): Faixa 1 até R$ 3.200; Faixa 2 até R$ 5.000; <b>Faixa 3 até R$ 9.600</b>; Faixa 4 até R$ 13.000.</li>'+
     '<li>Com <b>R$ 6.500</b> de renda familiar comprovada você cairia na Faixa 3: juros de referência 7,66%–8,16% a.a., imóvel até ≈ R$ 400 mil, <b>sem subsídio</b> (aporte de até R$ 55 mil só nas Faixas 1 e 2), prazo de até 420 meses.</li>'+
     '<li>Sem FGTS, você perde o desconto/entrada com FGTS. Renda de autônomo/PJ: regra de comprovação <b>não verificada</b> — pergunte à CAIXA.</li></ul>'+
     '<div class="row" style="margin-top:8px"><a class="mini" href="https://valorfinal.com.br/guia/minha-casa-minha-vida-2026" target="_blank" rel="noopener noreferrer">valorfinal.com.br ↗</a><a class="mini" href="https://oimparcial.com.br/noticias/2026/04/caixa-atualiza-minha-casa-minha-vida-com-novos-limites-de-renda-e-imoveis-de-ate-r-600-mil/" target="_blank" rel="noopener noreferrer">oimparcial.com.br ↗</a><a class="mini" href="https://www.caixa.gov.br/voce/habitacao/Paginas/default.aspx" target="_blank" rel="noopener noreferrer">CAIXA – habitação ↗</a></div></div>';
  var foco=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.cap:null,pos=null;
  if(foco){try{pos=document.activeElement.selectionStart}catch(e){}}
  $('#capacidade').innerHTML=h;
  if(foco){var el=$('[data-cap="'+foco+'"]');if(el){el.focus();if(pos!=null)try{el.setSelectionRange(pos,pos)}catch(e){}}}
}
function F(k,l){return '<label>'+esc(l)+'<input data-cap="'+k+'" inputmode="decimal" value="'+esc(cap()[k])+'"></label>'}
function kv(a,b,c){return '<div class="kv"><span>'+esc(a)+(c?'<div class="mini">'+esc(c)+'</div>':'')+'</span><b>'+esc(b)+'</b></div>'}

/* ---------- 3. Estratégias ---------- */
var ESTR=[
 ['A','Imóvel novo com entrada reduzida',
  'Construtora que parcela a entrada, unidade remanescente ou pronta com campanha.',
  ['Entrada em parcelas encaixa na renda mensal','Imóvel novo, menos reforma'],
  ['Parcelas da entrada + aluguel pesam juntas por meses','Na planta: correção (INCC) e risco de atraso'],
  'A entrada "anunciada" não é todo o dinheiro até as chaves. Se não sobra caixa hoje, parcelar só adia o problema.',

var dlg=$('#dlg'),frm=$('#frm'),atual=null;
function campo(c,v){
  var val=esc(v[c[0]]==null?'':v[c[0]]),cls=c[3]||'';
  if(c[2].indexOf('sel:')===0){var o=JSON.parse(c[2].slice(4));return '<label class="'+cls+'">'+esc(c[1])+'<select name="'+c[0]+'">'+Object.keys(o).map(function(k){return '<option value="'+k+'"'+(v[c[0]]===k?' selected':'')+'>'+esc(o[k])+'</option>'}).join('')+'</select></label>'}
  if(c[2]==='textarea')return '<label class="'+cls+'">'+esc(c[1])+'<textarea name="'+c[0]+'">'+val+'</textarea></label>';
  return '<label class="'+cls+'">'+esc(c[1])+'<input name="'+c[0]+'" type="'+c[2]+'" value="'+val+'"></label>';
}
function abre(tipo,doc){
  var F=FORMS[tipo];atual={tipo:tipo,id:doc?doc.id:uid()};var v=doc||F.vazio;
  frm.innerHTML='<h3 class="full">'+esc(F.titulo)+'</h3>'+F.campos.map(function(c){return campo(c,v)}).join('')+
    '<div class="row full" style="margin-top:6px"><button class="btn" value="ok">Salvar</button><button class="btn sec" type="button" id="cancela">Cancelar</button><span class="sp"></span>'+(doc?'<button class="btn sec" type="button" id="apaga" style="color:var(--t-bad);border-color:var(--t-bad)">Apagar</button>':'')+'</div>';
  dlg.showModal();
  $('#cancela').onclick=function(){dlg.close()};
  if(doc)$('#apaga').onclick=function(){if(confirm('Apagar este item?')){del(F.col,doc.id);dlg.close()}};
}
function abrePerfil(k){
  var meta=null;PERFIL_PADRAO.forEach(function(g){g[1].forEach(function(c){if(c[0]===k)meta=c})});
  var x=perfilVal(k);atual={tipo:'pf',id:k};
  frm.innerHTML='<h3 class="full">'+esc(meta[1])+'</h3>'+(meta[4]?'<div class="mini full">'+esc(meta[4])+'</div>':'')+
    '<label class="full">Resposta<textarea name="v">'+esc(x.v)+'</textarea></label>'+
    '<label class="full">Status<select name="s">'+Object.keys(ST_INFO).map(function(s){return '<option value="'+s+'"'+(x.s===s?' selected':'')+'>'+ST_INFO[s]+'</option>'}).join('')+'</select></label>'+
    '<div class="row full"><button class="btn" value="ok">Salvar</button><button class="btn sec" type="button" id="cancela">Cancelar</button></div>';
  dlg.showModal();$('#cancela').onclick=function(){dlg.close()};
}
frm.addEventListener('submit',function(e){
  e.preventDefault();
  if(atual.tipo==='pf'){var P=S.perfil||perfilBase();P[atual.id]={v:frm.elements.v.value.trim(),s:frm.elements.s.value};S.perfil=P;save('imv_config','perfil',P);dlg.close();rPerfil();return}
  var F=FORMS[atual.tipo],d={};
  F.campos.forEach(function(c){d[c[0]]=(frm.elements[c[0]].value||'').trim()});
  if(ehMRV(d.nome+' '+(d.vendedor||''))){alert('MRV está excluída das opções. Registro não salvo.');return}
  save(F.col,atual.id,d);dlg.close();
});

/* ---------- eventos ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  if(t.dataset.novo)abre(t.dataset.novo);
  else if(t.dataset.pf)abrePerfil(t.dataset.pf);
  else if(t.dataset.edit){var p=t.dataset.edit.split(':'),L={con:S.constr,imv:S.imv}[p[0]];abre(p[0],L.filter(function(x){return x.id===p[1]})[0])}
  else if(t.dataset.fazer){S.plano.done[t.dataset.fazer]=true;savePlano();rPlano()}
  else if(t.dataset.rm){S.plano.extra=S.plano.extra.filter(function(x){return x.id!==t.dataset.rm});delete S.plano.done[t.dataset.rm];savePlano();rPlano()}
  else if(t.dataset.sementes){['Tenda','Direcional','Victa Engenharia','Correta Engenharia'].forEach(function(n,i){save('imv_construtoras','seed'+i,{nome:n,status:'investigar',confianca:'baixa'})})}
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.dataset.cap){S.cap=cap();S.cap[el.dataset.cap]=el.value;saveCap();rCapacidade()}
  else if(el.dataset.sim){S.estr=S.estr||{};S.estr['sim'+el.dataset.sim.charAt(0).toUpperCase()+el.dataset.sim.slice(1)]=el.value;saveEstr();simula()}
  else if(el.dataset.estrnota){S.estr=S.estr||{};S.estr['n'+el.dataset.estrnota]=el.value;saveEstr()}
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.dataset.cap==='sist'){S.cap=cap();S.cap.sist=el.value;saveCap();rCapacidade()}
  else if(el.dataset.estr){S.estr=S.estr||{};S.estr['st'+el.dataset.estr]=el.value;saveEstr()}
  else if(el.dataset.chk){if(el.checked)S.plano.done[el.dataset.chk]=true;else delete S.plano.done[el.dataset.chk];savePlano();rPlano()}
});
document.addEventListener('submit',function(e){if(e.target.id!=='addItem')return;e.preventDefault();var v=$('#novoItem').value.trim();if(!v)return;S.plano.extra.push({id:'x'+uid(),t:v});savePlano();rPlano()});
$('#tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
  $('#tabs').querySelectorAll('button').forEach(function(x){x.setAttribute('aria-selected',x===b)});
  document.querySelectorAll('section').forEach(function(s){s.classList.toggle('on',s.id===b.dataset.t)})});

/* ---------- dados ---------- */
function lista(snap){return snap.docs.map(function(d){var o=d.data();o.id=d.id;return o})}
function aguardaDigitacao(){var a=document.activeElement;return a&&a.dataset&&(a.dataset.cap||a.dataset.sim||a.dataset.estrnota)}
claude.use('db').then(function(d){
  db=d;
  db.collection('imv_construtoras').onSnapshot(function(s){S.constr=lista(s);rConstrutoras()});
  db.collection('imv_imoveis').onSnapshot(function(s){S.imv=lista(s);rFinalistas()});
  db.doc('imv_plano/main').onSnapshot(function(s){var v=s.exists?s.data():{};S.plano={done:v.done||{},extra:v.extra||[]};rPlano()});
  db.doc('imv_config/perfil').onSnapshot(function(s){S.perfil=s.exists?Object.assign(perfilBase(),s.data()):null;rPerfil()});
  db.doc('imv_config/capacidade').onSnapshot(function(s){if(aguardaDigitacao())return;S.cap=s.exists?s.data():null;rCapacidade()});
  db.doc('imv_config/estrategias').onSnapshot(function(s){if(aguardaDigitacao())return;S.estr=s.exists?s.data():{};rEstrategias()});
});
renderAll();
})();
</script>
<script src="assets/modulo.js"></script>
</body>
