<script>
(function(){
'use strict';
var db=null;
var S={emp:[],con:[],opo:[],ati:[],tar:[],srv:[],cfg:null,sel:null,fil:{q:'',cidade:'',seg:'',etapa:'',prio:'',conf:'',serv:''},ord:'score',carregou:{}};
var $=function(s,r){return (r||document).querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(v){var s=String(v==null?'':v).trim();if(/,/.test(s))s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');var n=parseFloat(s);return isNaN(n)?0:n}
function brl(n){return (n<0?'−':'')+'R$ '+Math.round(Math.abs(n)).toLocaleString('pt-BR')}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function hoje(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dBR(d){return d?String(d).split('-').reverse().join('/'):''}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'')}
function dominio(u){try{return new URL(/^https?:/.test(u)?u:'https://'+u).hostname.replace(/^www\./,'')}catch(e){return ''}}
function urlOk(u){if(!u)return true;try{var x=new URL(u);return x.protocol==='http:'||x.protocol==='https:'}catch(e){return false}}
function barra(p){p=Math.max(0,Math.min(100,p));return '<div class="barra" role="progressbar" aria-valuenow="'+Math.round(p)+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+p+'%"></i></div>'}
function opts(o,v,vazio){return (vazio?'<option value="">'+esc(vazio)+'</option>':'')+Object.keys(o).map(function(k){return '<option value="'+esc(k)+'"'+(v===k?' selected':'')+'>'+esc(o[k])+'</option>'}).join('')}

/* ---------- configuração padrão ---------- */
var ETAPAS_PADRAO=[['descoberta','Empresa descoberta'],['pesquisa','Pesquisa pendente'],['qualificada','Empresa qualificada'],['pronta','Pronta para abordagem'],['contato','Primeiro contato realizado'],['aguardando','Aguardando resposta'],['conversa','Conversa iniciada'],['diagnostico','Diagnóstico agendado'],['oportunidade','Oportunidade qualificada'],['prep','Proposta em preparação'],['enviada','Proposta enviada'],['negociacao','Negociação'],['ganha','Ganha'],['perdida','Perdida'],['nutricao','Em nutrição / contato futuro']];
var PESOS_PADRAO={compat:25,necessidade:20,acesso:15,receita:15,viabilidade:15,recorrencia:10};
var PESO_NOME={compat:'Compatibilidade com meus serviços',necessidade:'Evidências de necessidade',acesso:'Acesso ao decisor',receita:'Potencial de receita',viabilidade:'Viabilidade em 5–10 h/semana',recorrencia:'Recorrência ou parceria'};
var CFG_PADRAO={nome:'Negócios e Oportunidades',etapas:ETAPAS_PADRAO.map(function(e){return {id:e[0],nome:e[1]}}),pesos:PESOS_PADRAO,horasSem:8,metaMin:2000,metaMax:4000,imposto:0,custoHora:0,investMax:500,diasRetorno:7,probEtapa:{oportunidade:20,prep:30,enviada:35,negociacao:55}};
function cfg(){var c=S.cfg||{},o={};Object.keys(CFG_PADRAO).forEach(function(k){o[k]=c[k]!=null?c[k]:CFG_PADRAO[k]});return o}
function etapas(){return cfg().etapas}
function nomeEtapa(id){var e=etapas().filter(function(x){return x.id===id})[0];return e?e.nome:id||'—'}
var CAT={A:'Engenharia de dados e integração',B:'Sistemas gerenciais e BI',C:'Automação de processos e IA',D:'Consultoria de operações',E:'Escalas 5x2 e equipes',F:'Postos de combustíveis e TRR',G:'Apoio técnico a outras empresas de tecnologia',H:'Capacitação técnica'};
var SERV_PADRAO=[
 {id:'s_a1',cat:'A',nome:'Automação de planilhas e consolidação de arquivos',horas:'12',prazo:'2 semanas',preco:'500–900',recorrente:'não',problema:'Relatórios montados à mão a partir de várias planilhas/exports.',entreg:'Rotina automatizada (Python/Power Query), documentação e 1 rodada de ajustes.',excl:'Mudança de sistemas de origem; suporte contínuo.',dep:'Acesso às planilhas/exports de exemplo.',aceite:'Relatório gerado sem edição manual em 2 ciclos reais.'},
 {id:'s_a2',cat:'A',nome:'Integração de API e banco de dados',horas:'20',prazo:'3 semanas',preco:'800–1.500',recorrente:'possível',problema:'Dados presos em sistemas que não conversam.',entreg:'Pipeline ETL/ELT agendado com logs e tratamento de falhas.',excl:'Licenças e infraestrutura do cliente.',dep:'Credenciais/ambiente de teste fornecidos pelo cliente.',aceite:'Carga automática validada contra amostra conferida.'},
 {id:'s_b1',cat:'B',nome:'Rotina automatizada de indicadores (dashboard)',horas:'24',prazo:'3–4 semanas',preco:'900–1.800',recorrente:'possível',problema:'Gestor sem visão consolidada de vendas/estoque/unidades.',entreg:'Modelo de dados + dashboard (Power BI ou web) com atualização automática.',excl:'Licenças Power BI.',dep:'Definição dos indicadores com o gestor.',aceite:'Indicadores batem com a fonte em fechamento mensal.'},
 {id:'s_c1',cat:'C',nome:'Extração de dados de PDFs/documentos',horas:'16',prazo:'2–3 semanas',preco:'800–1.500',recorrente:'não',problema:'Digitação manual de notas, boletos, relatórios em PDF.',entreg:'Rotina de extração com validação e fila de exceções para revisão humana.',excl:'Documentos fora do padrão acordado.',dep:'Amostra representativa de documentos.',aceite:'Taxa de acerto acordada em amostra de teste.'},
 {id:'s_d1',cat:'D',nome:'Diagnóstico de processos operacionais',horas:'8',prazo:'1–2 semanas',preco:'600–1.200',recorrente:'não',problema:'Retrabalho e gargalos não mapeados.',entreg:'Mapa do processo atual, lista priorizada de melhorias e estimativa de ganho.',excl:'Implementação.',dep:'Acesso às pessoas-chave por 2–3 conversas.',aceite:'Relatório entregue e validado em reunião.'},
 {id:'s_e1',cat:'E',nome:'Consultoria de adequação de escalas 5x2 (com validação jurídica externa)',horas:'30',prazo:'4–6 semanas',preco:'a definir',recorrente:'possível',problema:'Escalas manuais, risco de erro e custo de cobertura.',entreg:'Levantamento de regras e demanda, modelo de escala e simulações.',excl:'Parecer jurídico/trabalhista (deve ser feito por profissional competente).',dep:'Regras, convenção coletiva e dados de demanda do cliente.',aceite:'Escala-piloto aprovada pelo gestor e validada por responsável jurídico.'},
 {id:'s_f1',cat:'F',nome:'Indicadores operacionais por posto/TRR',horas:'24',prazo:'4 semanas',preco:'a definir',recorrente:'possível',problema:'Margem, frete e despesas difíceis de comparar entre unidades/operações.',entreg:'Consolidação de dados do sistema de gestão e painel por posto/operação.',excl:'Troca do sistema de gestão.',dep:'Export ou acesso de leitura ao sistema.',aceite:'Painel conciliado com fechamento do período.'},
 {id:'s_g1',cat:'G',nome:'Entrega técnica terceirizada (SQL, pipelines, cloud)',horas:'20',prazo:'conforme escopo',preco:'por hora ou projeto',recorrente:'possível',problema:'Parceiro com demanda acumulada de engenharia de dados.',entreg:'Entrega delimitada conforme escopo do parceiro.',excl:'Gestão do cliente final.',dep:'Escopo escrito e acesso ao ambiente.',aceite:'Critérios do parceiro atendidos.'},
 {id:'s_m1',cat:'A',nome:'Manutenção mensal delimitada',horas:'4/mês',prazo:'recorrente',preco:'600–1.200/mês',recorrente:'sim',problema:'Rotinas entregues precisam de monitoramento e ajustes.',entreg:'Monitoramento, correções e pequenos ajustes dentro do limite de horas.',excl:'Novas funcionalidades.',dep:'Contrato mensal.',aceite:'SLA acordado.'}];
function servicos(){return S.srv.length?S.srv:SERV_PADRAO}
function servNome(id){var s=servicos().filter(function(x){return x.id===id})[0];return s?s.nome:''}

/* ---------- pontuação 0–100 (explicável) ---------- */
function fatores(e){
  var ind=(e.indicios||[]).length,cp=e.contatosPublicos||[],temNome=cp.some(function(c){return c.nome&&c.funcao}),temFun=cp.some(function(c){return c.funcao}),
      canal=e.email||e.whatsapp||e.telefone,sv=(e.servicos||[]),porte=e.porte||'desconhecido';
  var f={};
  f.compat=e.aderente==='sim'?(sv.length>=2?1:.8):e.aderente==='duvida'?.4:e.aderente==='nao'?0:.3;
  var ev=((e.dossie||{}).dores||[]).filter(function(x){return (x.status==='confirmada'||x.status==='indicio')&&(x.evidencia||'').trim()}).length;
  f.necessidade=(ind||ev)?Math.min(1,.35*ind+.3*ev):.2;
  f.acesso=temNome?1:temFun?.6:(e.email||e.whatsapp)?.45:e.telefone?.25:0;
  f.receita=({grande:1,medio:1,'médio':1,pequeno:.55,desconhecido:.3})[porte]||.3;
  f.viabilidade=({pequeno:1,'médio':.8,medio:.8,grande:.4,desconhecido:.5})[porte]||.5;
  f.recorrencia=(sv.indexOf('G')>=0||sv.indexOf('E')>=0)?1:(sv.indexOf('B')>=0||sv.indexOf('F')>=0)?.7:.4;
  if(canal===undefined||canal===null){}
  return f;
}
function score(e){
  var p=cfg().pesos,f=fatores(e),man=e.scoreManual||{},det={},tot=0,max=0;
  Object.keys(p).forEach(function(k){var w=num(p[k]),auto=Math.round(f[k]*w),v=man[k]!=null&&man[k]!==''?Math.max(0,Math.min(w,num(man[k]))):auto;det[k]={w:w,auto:auto,v:v,manual:man[k]!=null&&man[k]!==''};tot+=v;max+=w});
  var t=max?Math.round(tot/max*100):0;
  return {total:t,det:det,prov:e.pesquisa!=='verificada'};
}
function prioridade(e){
  if(e.prioridade)return e.prioridade;
  if(e.aderente==='nao')return 'nao';
  if(e.pesquisa==='pendente')return 'pesq';
  var s=score(e).total;return s>=65?'alta':s>=45?'media':'baixa';
}
var PRIO={alta:'Alta',media:'Média',baixa:'Baixa',pesq:'Pesquisa adicional',nao:'Não aderente'};

/* ---------- derivados ---------- */
function emp(id){return S.emp.filter(function(e){return e.id===id})[0]}
function opsDe(id){return S.opo.filter(function(o){return o.empresaId===id})}
function atDe(id){return S.ati.filter(function(a){return a.empresaId===id}).sort(function(a,b){return (b.data||'').localeCompare(a.data||'')||(b.criado||0)-(a.criado||0)})}
function probOp(o){var p=o.prob!==''&&o.prob!=null?num(o.prob):num(cfg().probEtapa[o.etapa]||10);return Math.max(0,Math.min(100,p))/100}
function emAberto(o){return o.etapa!=='ganha'&&o.etapa!=='perdida'&&o.etapa!=='nutricao'}
function ultimoContato(id){var l=atDe(id).filter(function(a){return a.tipo==='contato'||a.canal});return l[0]||null}
function dias(d){if(!d)return null;return Math.round((new Date(hoje()+'T12:00:00')-new Date(d+'T12:00:00'))/864e5)}
function atrasadas(){
  var h=hoje(),r=[];
  S.tar.forEach(function(t){if(!t.feito&&t.data&&t.data<h)r.push({tipo:'tarefa',id:t.id,empresaId:t.empresaId,txt:t.titulo,data:t.data})});
  S.emp.forEach(function(e){if(e.proxData&&e.proxData<h&&e.proxAcao&&e.etapa!=='perdida'&&e.etapa!=='ganha')r.push({tipo:'empresa',id:e.id,empresaId:e.id,txt:e.proxAcao,data:e.proxData})});
  S.opo.forEach(function(o){if(o.proxData&&o.proxData<h&&o.proxAcao&&emAberto(o))r.push({tipo:'oport',id:o.id,empresaId:o.empresaId,txt:o.proxAcao,data:o.proxData})});
  return r.sort(function(a,b){return a.data.localeCompare(b.data)});
}
function proximaAcao(e){
  if(e.proxAcao)return e.proxAcao;
  if(e.pesquisa==='pendente')return 'Concluir a pesquisa (site, contatos, porte)';
  if(e.aderente!=='nao'&&prontidao(e).pct<80&&['contato','aguardando','conversa','diagnostico','oportunidade','prep','enviada','negociacao','ganha','perdida','nutricao'].indexOf(e.etapa)<0)return 'Completar o dossiê de dores antes de abordar';
  if(!(e.contatosPublicos||[]).length&&!e.email&&!e.whatsapp&&!e.telefone)return 'Achar um canal público de contato';
  if(!ultimoContato(e.id)&&e.aderente!=='nao')return 'Preparar e revisar a primeira mensagem';
  return '';
}

function fmt(t){
  var linhas=String(t||'').split('\n').filter(function(x){return x.trim()});
  return linhas.map(function(l){
    var m=l.replace(/^\s*[•\-\*]\s*/,''),tag='',cl='';
    var r=m.match(/^\[(Fato|Indício|Setor|Hipótese|Não sei)\]\s*/);
    if(r){tag='<span class="tag '+TAGS[r[1]]+'">'+(r[1]==='Setor'?'Típico do setor':r[1])+'</span> ';m=m.slice(r[0].length)}
    return '<p style="margin:6px 0;font-size:17px;line-height:1.55">'+tag+esc(m)+'</p>';
  }).join('');
}
function prontidao(e){

    {ok:(d.operacao||'').trim().length>15,t:'Sei como a operação funciona'},
    {ok:(d.decisao||'').trim().length>9,t:'Sei quem decide'},
    {ok:l.some(function(x){return (x.evidencia||'').trim()}),t:'Tenho uma dor provável com evidência'},

/* ---------- Por que esta empresa e como contatar ---------- */
function porque(e){
  var r=[],sv=e.servicos||[],f=(e.fatos||[]),ind=(e.indicios||[]);
  var dl=dores(e).filter(function(x){return x.status!=='descartada'}),dr=dl.filter(function(x){return x.status!=='segmento'})[0]||dl[0];
  if(dr)r.push((dr.status==='segmento'?'Dor comum no segmento (a confirmar): ':'Dor provável: ')+dr.texto+(dr.evidencia?' — '+dr.evidencia:''));
  if(e.unidades)r.push('Unidades registradas na pesquisa: '+e.unidades+' (confira a fonte antes de citar na conversa).');
  else if(f.length)r.push('Fato verificado: '+(f[0].texto||f[0])+'.');
  if(ind.length)r.push('Indício: '+(ind[0].texto||ind[0])+'.');
  var o=(e.ofertas||[])[0];
  if(o)r.push('Oferta a validar: '+o+' (hipótese, não necessidade confirmada).');
  if(sv.indexOf('E')>=0||/posto|academia|facilities|superm|farm|clinica|labor|restaur/.test(norm((e.segmento||'')+(e.subsegmento||''))))r.push('Equipes em turnos: pode haver espaço para o piloto de escalas.');
  if(e.porte==='pequeno'||e.porte==='médio')r.push('Porte '+e.porte+(e.porteBase?' ('+e.porteBase+')':'')+': mais fácil falar com o dono ou gestor.');
  if(!r.length)r.push('Ainda sem evidência suficiente: pesquisa '+(e.pesquisa||'pendente')+'. Complete a pesquisa antes de abordar.');
  if(e.pesquisa!=='verificada')r.push('Atenção: pesquisa '+(e.pesquisa||'pendente')+', pontuação provisória.');
  return r;
}
function comoContatar(e){
  var c=[],cp=e.contatosPublicos||[],pessoa=cp.filter(function(x){return x.nome&&x.funcao})[0];
  if(pessoa)c.push('Quem: '+pessoa.nome+' ('+pessoa.funcao+'), publicado no site da empresa. Peça uma conversa de 15 minutos pelo canal institucional.');
  else c.push('Quem: o decisor não está publicado. Pergunte quem cuida de operações, administrativo ou gestão e peça o encaminhamento.');
  if(e.whatsapp)c.push('Canal principal: WhatsApp comercial '+e.whatsapp+' (mensagem curta, aba Abordagem personalizada).');
  if(e.telefone)c.push((e.whatsapp?'Alternativa':'Canal principal')+': telefone '+e.telefone+' (use o roteiro de ligação de 2 minutos).');
  if(e.email){var rh=cp.some(function(x){return x.canal===e.email&&/rh|recurso/i.test(x.funcao||'')})||/^(rh|recursoshumanos|trabalheconosco|vagas)@/i.test(e.email);
    c.push((e.whatsapp||e.telefone?'Alternativa':'Canal principal')+': e-mail '+e.email+(rh?' — é e-mail de RH, não do decisor: use só para pedir encaminhamento.':'.'))}
  if(!e.whatsapp&&!e.telefone&&!e.email){
    if(e.linkedin)c.push('Canal: página institucional no LinkedIn; procure ali o sócio ou o gestor de operações.');
    else c.push('Nenhum canal público registrado: procure o site oficial, o Google Maps (telefone) ou o LinkedIn da empresa. Tarefa de pesquisa antes de abordar.');
  }
  c.push('Primeiro passo: '+(proximaAcao(e)||'revisar a primeira mensagem')+'. Nada é enviado automaticamente.');
  return c;
}

/* ---------- Painel completo (recolhido) ---------- */
function painelCompleto(){
  var n=S.emp.length,cont=0,qual=0,pesq=0,pron=0,resp=0,diag=0,prop=0,neg=0,ganh=0,perd=0;
  S.emp.forEach(function(e){var t=e.etapa||'descoberta';
    if(['qualificada','pronta'].indexOf(t)>=0||ETAPAS_IDX(t)>=2&&ETAPAS_IDX(t)<12)qual++;
    if(t==='pesquisa'||t==='descoberta'||e.pesquisa==='pendente')pesq++;
    if(t==='pronta')pron++;});
  S.ati.forEach(function(a){});
  var comContato={},comResp={};S.ati.forEach(function(a){if(a.tipo==='contato'||a.canal){comContato[a.empresaId]=1;if(a.resp)comResp[a.empresaId]=1}});
  cont=Object.keys(comContato).length;resp=Object.keys(comResp).length;
  S.opo.forEach(function(o){if(o.etapa==='diagnostico')diag++;if(o.etapa==='enviada')prop++;if(o.etapa==='negociacao')neg++;if(o.etapa==='ganha')ganh++;if(o.etapa==='perdida')perd++});
  S.emp.forEach(function(e){if(e.etapa==='diagnostico')diag++});
  var v=valores(),at=atrasadas();
  var h='';
  if(!S.emp.length)h+='<div class="aviso">Nenhuma empresa cadastrada ainda. Cadastre em <b>Empresas</b> ou importe a base inicial (<code>npm run import -- negocios-base.json</code>). Nada aqui é preenchido com dados inventados.</div>';
  h+='<div class="grid">'+
   card('Empresas',n,'pesquisadas ('+S.emp.filter(function(e){return e.pesquisa==='verificada'}).length+' verificadas)')+
   card('Qualificadas',qual,pesq+' ainda precisam de pesquisa')+
   card('Prontas p/ abordagem',pron,'')+
   card('Contatadas',cont,resp+' responderam')+
   card('Diagnósticos',diag,'agendados / em conversa')+
   card('Propostas',prop,neg+' em negociação')+

  else if(q==='recorr'){var l5=ativos.filter(function(e){var sv=e.servicos||[];return sv.indexOf('G')>=0||sv.indexOf('B')>=0||sv.indexOf('F')>=0||sv.indexOf('E')>=0}).map(function(e){return {e:e,s:score(e)}}).sort(function(a,b){return b.s.det.recorrencia.v-a.s.det.recorrencia.v||b.s.total-a.s.total}).slice(0,6);out='Indícios de recorrência (parceria, BI, escalas ou posto/TRR):\n'+lista(l5,function(x){return '• '+x.e.nome+' — '+x.s.total+(x.s.prov?' prov.':'')})}

function filtradas(){
  var f=S.fil,q=norm(f.q);

    if(q&&norm([e.nome,e.razao,e.segmento,e.subsegmento,e.cidade,e.descricao,e.obs].join(' ')).indexOf(q)<0)return false;
    if(f.cidade&&e.cidade!==f.cidade)return false;if(f.seg&&e.segmento!==f.seg)return false;
    if(f.etapa&&(e.etapa||'descoberta')!==f.etapa)return false;if(f.prio&&prioridade(e)!==f.prio)return false;
    if(f.conf&&e.pesquisa!==f.conf)return false;if(f.serv&&(e.servicos||[]).indexOf(f.serv)<0)return false;return true});

  return l;
}

/* ---------- Capacidade e receita ---------- */
function capac(){
  var c=cfg(),capMes=num(c.horasSem)*4.33,comprom=0,pondH=0;
  S.opo.forEach(function(o){if(o.etapa==='ganha'&&!o.concluida)comprom+=Math.max(0,num(o.horas)-num(o.horasFeitas));else if(emAberto(o))pondH+=num(o.horas)*probOp(o)});
  return {capMes:capMes,comprom:comprom,pondH:pondH,ocup:capMes?comprom/capMes*100:0};
}
function rCapac(){

  var custos=0;S.opo.forEach(function(o){if(o.etapa==='ganha')custos+=num(o.custos)});

  function cen(f){var t=v.contr;S.opo.forEach(function(o){if(emAberto(o))t+=num(o.vEst)*Math.min(1,probOp(o)*f)});return t}
  var h='<div class="aviso ruim"><b>Antes de faturar extra, confira com um contador:</b> você é MEI e o teto de faturamento anual é R$ 81 mil. Hoje seus recebimentos já estão perto disso (R$ 6.500 × 12 = R$ 78 mil, mais bônus). Uma renda extra de R$ 2–4 mil/mês pode ultrapassar o teto e exigir outro enquadramento ou CNPJ. Verifique também se o seu contrato atual tem <b>exclusividade, não concorrência ou cláusulas de propriedade intelectual</b>, e não reutilize código, dados ou documentos da empresa em projetos externos. Isto é um alerta, não orientação jurídica ou fiscal.</div>';
  h+='<div class="grid">'+card('Horas disponíveis/mês',k.capMes.toFixed(0)+' h',c.horasSem+' h por semana')+card('Comprometidas',k.comprom.toFixed(0)+' h','projetos ganhos em aberto',k.comprom>k.capMes?'ruim':'')+
     '<div class="cartao"><div class="rotulo">Ocupação</div><div class="big">'+Math.round(k.ocup)+'%</div>'+barra(k.ocup)+'<div class="mini">'+(k.ocup>100?'⚠ sobrecarga — não aceite novos projetos':k.ocup>80?'perto do limite':'há folga')+'</div></div>'+card('Horas ponderadas em aberto',k.pondH.toFixed(0)+' h','horas × probabilidade')+'</div>';
  h+='<div class="grid2"><div class="cartao"><h3>Receita (valores separados)</h3>'+kv('Estimada (abertas)',brl(v.est),true)+kv('Ponderada (projeção)',brl(v.pond),true)+kv('Proposta enviada',brl(v.prop),true)+kv('Contratada',brl(v.contr),true)+kv('Recebida (registrada)',brl(v.rec),true)+

  var ESS={emp:['nome','segmento','cidade','site','telefone','whatsapp','email'],opo:['empresaId','servicoId','etapa','vEst','horas','proxAcao']}[tipo],corpo;

frm.addEventListener('submit',function(ev){
  if(atual.tipo==='pont'||atual.tipo==='dos'||atual.tipo==='dor')return;
  ev.preventDefault();var Fm=F[atual.tipo],d=Object.assign({},atual.antes||{});delete d.id;
  Fm.campos.forEach(function(c){d[c[0]]=(frm.elements[c[0]].value||'').trim()});
  if(d.site&&!urlOk(d.site)){alert('O site precisa começar com http:// ou https://');return}
  if(d.linkedin&&!urlOk(d.linkedin)){alert('LinkedIn: use um endereço completo (https://…)');return}
  if(atual.tipo==='emp'){
    if(!d.nome){alert('Informe o nome da empresa.');return}
    d.servicos=Object.keys(CAT).filter(function(k){return frm.elements['sv_'+k]&&frm.elements['sv_'+k].checked});
    var dup=S.emp.filter(function(e){return e.id!==atual.id&&(norm(e.nome)===norm(d.nome)||(d.site&&e.site&&dominio(e.site)&&dominio(e.site)===dominio(d.site)))})[0];
    if(dup&&!confirm('Já existe "'+dup.nome+'" com nome ou site parecido. Salvar mesmo assim?'))return;
    if(!atual.antes)d.criadoEm=hoje();
    var antes=atual.antes;
    if(antes&&(antes.etapa||'descoberta')!==d.etapa)log(atual.id,{tipo:'etapa',msg:nomeEtapa(antes.etapa||'descoberta')+' → '+nomeEtapa(d.etapa)});
  }
  if(atual.tipo==='opo'&&!d.empresaId){alert('Escolha a empresa.');return}
  if(atual.tipo==='opo'&&atual.antes&&atual.antes.etapa!==d.etapa){var j=prompt('Justificativa da mudança de "'+nomeEtapa(atual.antes.etapa)+'" para "'+nomeEtapa(d.etapa)+'" (opcional):')||'';log(d.empresaId,{tipo:'etapa',msg:'Oportunidade: '+nomeEtapa(atual.antes.etapa)+' → '+nomeEtapa(d.etapa)+(j?' — '+j:'')})}
  if(atual.tipo==='ati'){d.tipo='contato';d.empresaId=atual.pre&&atual.pre.empresaId||d.empresaId;d.criado=Date.now()}
  if(atual.tipo==='con'||atual.tipo==='tar'){if(atual.pre&&atual.pre.empresaId)d.empresaId=atual.pre.empresaId}
  if(atual.tipo==='tar'&&!atual.antes)d.feito=false;
  save(Fm.col,atual.id,d);dlg.close();
});

  else{
    var f=frm.elements,o={texto:f.texto.value.trim(),status:f.status.value,cat:f.cat.value,evidencia:f.evidencia.value.trim(),fonte:f.fonte.value.trim(),impacto:f.impacto.value.trim(),pergunta:f.pergunta.value.trim()};
    if(!o.texto){alert('Descreva a dor.');return}
    if(o.fonte&&!urlOk(o.fonte)){alert('A fonte precisa ser um link completo (https://…).');return}
    if(o.status==='confirmada'&&!o.evidencia){alert('Para marcar como confirmada pelo cliente, registre a evidência (o que foi dito, por quem e quando).');return}
    var l=dores(e).slice();if(atual.idx>=0)l[atual.idx]=o;else l.push(o);d.dossie.dores=l;
  }
  saveEmp(d);dlg.close();
},true);

/* ---------- CSV ---------- */
function csv(tipo){
  var rows,cols;
  if(tipo==='emp'){cols=['nome','razao','segmento','subsegmento','cidade','site','telefone','email','whatsapp','linkedin','unidades','porte','aderente','pesquisa','etapa','proxAcao','proxData','verificadoEm','obs'];rows=S.emp.map(function(e){var r=cols.map(function(c){return e[c]});r.push(score(e).total);return r});cols=cols.concat(['pontuacao'])}
  else{cols=['empresa','servico','etapa','horas','vEst','vProp','vContr','vRec','custos','prob','proxAcao','proxData'];rows=S.opo.map(function(o){var e=emp(o.empresaId);return [e?e.nome:'',servNome(o.servicoId),nomeEtapa(o.etapa),o.horas,o.vEst,o.vProp,o.vContr,o.vRec,o.custos,o.prob,o.proxAcao,o.proxData]})}
  var q=function(x){var s=String(x==null?'':x);if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};
  var txt='﻿'+[cols].concat(rows).map(function(r){return r.map(q).join(';')}).join('\r\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));a.download='negocios-'+tipo+'-'+hoje()+'.csv';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
}

/* ---------- eventos ---------- */
function irEmpresas(){document.querySelector('[data-t=empresas]').click()}
document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-emp],button,tr[data-edit]');if(!t)return;
  var d=t.dataset;
  if(d.emp){ev.preventDefault();S.sel=d.emp;irEmpresas();rEmpresas();window.scrollTo(0,0);return}
  if(t.tagName==='TR'&&d.edit){var p=d.edit.split(':');var L={opo:S.opo,emp:S.emp}[p[0]];abre(p[0],L.filter(function(x){return x.id===p[1]})[0]);return}
  if(t.tagName!=='BUTTON')return;
  if(d.q)responde(d.q);
  else if(d.vis){S.vis=d.vis;rPipeline()}
  else if(d.outra){S.focoIdx=(S.focoIdx||0)+1;rPainel()}
  else if(d.irtab){var bt=document.querySelector('[data-t='+d.irtab+']');if(bt)bt.click()}
  else if(d.voltar){S.sel=null;rEmpresas()}
  else if(d.novo){var pp=d.novo.split(':');if(pp[0]==='emp')abre('emp');else if(pp[1]){abrePre(pp[0],{empresaId:pp[1]})}else abre(pp[0])}
  else if(d.edit){var q=d.edit.split(':'),L2={emp:S.emp,con:S.con,opo:S.opo,srv:S.srv,tar:S.tar}[q[0]];abre(q[0],L2.filter(function(x){return x.id===q[1]})[0])}
  else if(d.ajusta)ajusta(emp(d.ajusta));
  else if(d.dossie)abreDossie(emp(d.dossie));
  else if(d.novador)abreDor(emp(d.novador),-1);
  else if(d.dor){var dd=d.dor.split(':');abreDor(emp(dd[0]),+dd[1])}
  else if(d.gerar){var e=emp(d.gerar);S.msgTipo=$('#msgTipo').value;$('#msgOut').value=gerar(e,S.msgTipo)}
  else if(d.copiar){var o=$('#msgOut');o.select();try{navigator.clipboard.writeText(o.value)}catch(x){document.execCommand('copy')}}
  else if(d.regcontato){abrePre('ati',{empresaId:d.regcontato,data:hoje(),msg:($('#msgOut')||{}).value||''});var m=$('#frm').elements.msg;if(m&&!m.value)m.value=($('#msgOut')||{}).value||'';frm.elements.data.value=hoje()}
  else if(d.csv)csv(d.csv);
  else if(d.padrao){SERV_PADRAO.forEach(function(s){var c=Object.assign({},s);delete c.id;save('neg_servicos',s.id,c)})}
  else if(d.resetcfg){if(confirm('Restaurar configurações padrão?')){S.cfg=null;save('neg_config','main',CFG_PADRAO).then(function(){});S.cfg=CFG_PADRAO;renderAll()}}
  else if(d.dup){var m2={},out=[];S.emp.forEach(function(e){[norm(e.nome),dominio(e.site||'')].filter(Boolean).forEach(function(k){(m2[k]=m2[k]||[]).push(e.nome)})});Object.keys(m2).forEach(function(k){var u=m2[k].filter(function(x,i,a){return a.indexOf(x)===i});if(m2[k].length>1&&u.length>=1&&m2[k].length>1)out.push(m2[k].join(' ≈ '))});$('#dupOut').textContent=out.length?'Possíveis duplicadas: '+out.filter(function(x,i,a){return a.indexOf(x)===i}).join(' | '):'Nenhuma duplicada encontrada.'}
});
document.addEventListener('input',function(ev){var el=ev.target;if(el.dataset.f==='q'){S.fil.q=el.value;rEmpresas()}});
document.addEventListener('change',function(ev){
  var el=ev.target,d=el.dataset;
  if(d.f){if(d.f==='ord')S.ord=el.value;else S.fil[d.f]=el.value;rEmpresas()}
  else if(d.mover){var e=emp(d.mover),novo=el.value;if(e&&novo!==(e.etapa||'descoberta')){if((novo==='pronta'||novo==='contato')&&prontidao(e).pct<80&&!confirm('O dossiê de dores desta empresa está em '+prontidao(e).pct+'% (mínimo 80%). Entender as dores antes de abordar. Mover mesmo assim?')){rPipeline();return}var j=(novo==='perdida'||novo==='nutricao'||novo==='ganha')?prompt('Justificativa (opcional):')||'':'';var a=nomeEtapa(e.etapa||'descoberta');e.etapa=novo;saveEmp(e);log(e.id,{tipo:'etapa',msg:a+' → '+nomeEtapa(novo)+(j?' — '+j:'')});rPipeline()}}
  else if(d.tar){var t=S.tar.filter(function(x){return x.id===d.tar})[0];if(t){t.feito=el.checked;var c=Object.assign({},t);delete c.id;save('neg_tarefas',t.id,c)}}
});
document.addEventListener('submit',function(ev){
  if(ev.target.id!=='cfgForm')return;ev.preventDefault();
  var f=ev.target.elements,c=cfg();
  c.nome=f.nome.value.trim()||CFG_PADRAO.nome;['horasSem','investMax','metaMin','metaMax','imposto','diasRetorno'].forEach(function(k){c[k]=num(f[k].value)});
  c.pesos={};Object.keys(PESO_NOME).forEach(function(k){c.pesos[k]=num(f['p_'+k].value)});
  c.probEtapa=Object.assign({},c.probEtapa);['oportunidade','prep','enviada','negociacao'].forEach(function(k){c.probEtapa[k]=num(f['e_'+k].value)});
  var et=f.etapas.value.split('\n').map(function(l){var p=l.split('|');return {id:(p[0]||'').trim(),nome:(p[1]||'').trim()}}).filter(function(x){return x.id&&x.nome});
  if(!et.some(function(x){return x.id==='ganha'})||!et.some(function(x){return x.id==='perdida'})){alert('Mantenha as etapas "ganha" e "perdida".');return}
  c.etapas=et;S.cfg=c;saveCfg();alert('Configurações salvas.');renderAll();
});
function navClick(ev){var b=ev.target.closest('button');if(!b)return;
  if(b.dataset.t==='mais'){var n=$('#tabs2'),aberto=n.style.display!=='none';n.style.display=aberto?'none':'flex';b.setAttribute('aria-expanded',String(!aberto));return}
  document.querySelectorAll('#tabs button,#tabs2 button').forEach(function(x){x.setAttribute('aria-selected',x===b)});
  document.querySelectorAll('section').forEach(function(s){s.classList.toggle('on',s.id===b.dataset.t)});
  if(b.dataset.t==='empresas'&&S.sel&&!emp(S.sel))S.sel=null}
$('#tabs').addEventListener('click',navClick);$('#tabs2').addEventListener('click',navClick);

/* ---------- dados ---------- */
function lista(snap){return snap.docs.map(function(d){var o=d.data();o.id=d.id;return o})}
function renderAll(){$('#tit').textContent=cfg().nome;rPainel();rPipeline();rEmpresas();rOport();rAbordagem();rAgenda();rServicos();rCapac();rConfig()}
var tmr=null;function agenda(){clearTimeout(tmr);tmr=setTimeout(function(){var a=document.activeElement;if(a&&a.closest&&a.closest('#config form')&&a.tagName!=='BUTTON'){return}renderAll()},60)}
claude.use('db').then(function(d){
  db=d;
  var m={neg_empresas:'emp',neg_contatos:'con',neg_oportunidades:'opo',neg_atividades:'ati',neg_tarefas:'tar',neg_servicos:'srv'};
  Object.keys(m).forEach(function(col){db.collection(col).onSnapshot(function(s){S[m[col]]=lista(s);agenda()})});
  db.doc('neg_config/main').onSnapshot(function(s){S.cfg=s.exists?s.data():null;agenda()});
},function(){});
renderAll();
})();
