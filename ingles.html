<style>
*{box-sizing:border-box}
body{margin:0}
main{max-width:860px;margin:0 auto;padding:16px 16px calc(80px + env(safe-area-inset-bottom))}
h1{font-size:28px}
h2{font-size:21px}
h3{font-size:18px}
.sub{color:var(--t-muted);margin:4px 0 16px}
.mini{font-size:13px;color:var(--t-muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
nav{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 16px;padding:0 16px}
nav button{font:inherit;font-size:15px;min-height:44px;padding:8px 16px;border-radius:var(--raio);border:1px solid var(--t-line);background:var(--t-surface);color:var(--t-ink);white-space:nowrap;cursor:pointer}
nav button[aria-selected=true]{background:var(--m);border-color:var(--m);color:var(--t-accent-ink)}
section{display:none}section.on{display:block}
.barra{height:8px;background:var(--t-line);overflow:hidden;margin:8px 0}
.barra i{display:block;height:100%;background:var(--t-ok)}
@media (prefers-reduced-motion:no-preference){.barra i{animation:cresce .8s ease-out}@keyframes cresce{from{width:0}}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.stats .big{font:600 26px/1.1 var(--f-titulo);letter-spacing:var(--titulo-tracking);margin-top:6px}
.stats small{display:block;color:var(--t-muted);font-size:12px;margin-top:2px}
.resumo{margin-bottom:16px}
.cartao+.cartao{margin-top:12px}
.tag{font:500 11px var(--f-mono);padding:3px 8px;border:1px solid var(--t-line);background:var(--t-realce);color:var(--t-ink);letter-spacing:.04em;display:inline-block;margin-right:4px}
.tag.q{background:color-mix(in srgb,var(--t-ok) 18%,var(--t-surface));border-color:var(--t-ok)}
.tag.ia{background:color-mix(in srgb,var(--t-accent2) 25%,var(--t-surface));border-color:var(--t-accent2)}
.tar{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--t-line)}
.tar:first-of-type{border-top:0}
.tar .chk{flex:none;width:48px;height:48px;border-radius:24px;border:2px solid var(--t-borda);background:var(--t-bg);color:var(--t-bg);font:700 22px var(--f-texto);cursor:pointer;padding:0}
.tar.ok .chk{background:var(--t-ok);border-color:var(--t-ok);color:#fff}
.tar .tx{flex:1;min-width:0;padding-top:2px}
.tar .tx div{margin-top:5px;overflow-wrap:anywhere}
.tar.ok .tx div{color:var(--t-muted)}
.dica{margin-top:12px;padding:10px 12px;border-left:3px solid var(--t-accent2);background:var(--t-realce);font-size:14px}
.btn{min-height:46px}
.passos{margin:8px 0 0;padding-left:22px}
.passos li{margin:8px 0;line-height:1.5;overflow-wrap:anywhere}
.pronto{margin-top:10px;padding:10px 12px;border-left:3px solid var(--t-ok);background:var(--t-realce);font-size:14px}
details{border:1px solid var(--t-line);background:var(--t-surface);border-radius:var(--raio);margin-bottom:8px}
details>summary{min-height:48px;display:flex;align-items:center;gap:8px;padding:6px 14px;cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"›";color:var(--t-muted);font-size:20px;transition:transform .15s}
details[open]>summary::before{transform:rotate(90deg)}
details>.corpo{padding:2px 14px 14px}
details.sem>summary{font:600 17px var(--f-titulo)}
details.dia{margin:8px 0 0;background:var(--t-bg)}
details.dia>summary{font-size:15px}
.cont{display:flex;align-items:center;gap:8px;margin-top:8px}
.cont button{width:48px;height:48px;border-radius:24px;border:2px solid var(--t-borda);background:var(--t-bg);color:var(--t-ink);font:700 22px var(--f-texto);cursor:pointer;padding:0}
.cont b{font:600 22px var(--f-titulo);min-width:64px;text-align:center}
form.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
form.f label{display:flex;flex-direction:column;gap:3px;font-size:14px;color:var(--t-muted)}
form.f .full{grid-column:1/-1}
form.f input,form.f select,form.f textarea{font:inherit;font-size:16px;padding:10px;min-height:46px;border:1px solid var(--t-borda);background:var(--t-bg);color:var(--t-ink);border-radius:var(--raio);width:100%}
dialog{border:1px solid var(--t-line);background:var(--t-surface);color:var(--t-ink);border-radius:var(--raio);padding:18px;width:min(520px,94vw)}
dialog::backdrop{background:rgba(40,30,60,.35)}
.lk{min-height:44px;padding:0 4px;border:0;background:none;color:var(--t-accent);font:600 14px var(--f-texto);text-decoration:underline;cursor:pointer}
.ev{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--t-line);overflow-wrap:anywhere}
.ev a{color:var(--t-accent)}
.frase{padding:10px 0;border-top:1px solid var(--t-line)}
.frase:first-of-type{border-top:0}
.frase b{display:block;font-size:16px}
.copia{white-space:pre-wrap;font:13px/1.5 var(--f-mono);background:var(--t-realce);padding:12px;border:1px solid var(--t-line);overflow-wrap:anywhere}
.campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
.campos label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--t-muted)}
.campos input{font:inherit;font-size:16px;padding:10px;min-height:46px;border:1px solid var(--t-borda);background:var(--t-bg);color:var(--t-ink);border-radius:var(--raio);width:100%}
</style>

</head>
<body class="t">
<style>
#modo{position:fixed;inset:0;z-index:60;background:var(--t-bg);overflow:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
#modo[hidden]{display:none}
#modo .wrap{max-width:640px;margin:0 auto}
.flash{padding:22px 18px;border:1px solid var(--t-line);background:var(--t-surface);border-radius:var(--raio);margin:14px 0}
.flash .pt{font:600 21px/1.35 var(--f-titulo)}
.flash .en{font:600 24px/1.3 var(--f-titulo);color:var(--t-accent)}
.flash .ex{margin-top:10px;font-size:17px;line-height:1.5}
.flash .nota{margin-top:10px;font-size:14px;color:var(--t-muted)}
.resp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.resp button,#modo .grande{min-height:56px;font:600 17px var(--f-texto);border-radius:var(--raio);cursor:pointer;border:1px solid var(--t-borda);background:var(--t-surface);color:var(--t-ink)}
.resp .sim,#modo .grande.pri{background:var(--m);border-color:var(--m);color:var(--t-accent-ink)}
.molde{margin:6px 0 10px;padding:8px 10px;background:var(--t-realce);border-left:3px solid var(--t-accent);font-size:14px;overflow-wrap:anywhere}
.molde b{display:block;font-size:13px;margin-bottom:2px}
.voc{padding:10px 0;border-top:1px solid var(--t-line)}
.voc:first-of-type{border-top:0}
.voc b{display:block;font-size:16px}
.voc .e{font-size:14px;margin-top:3px;overflow-wrap:anywhere}
</style>
<main>
  <h1>Inglês</h1>
  <p class="sub">Foco em fala, vocabulário e gramática, voltados à sua carreira: entrevistas, conversa técnica, reuniões, apresentação e negociação. Meta de 7 aulas do curso por semana, mais 2h30 de prática. Semana atrasada não zera nada.</p>
  <div id="curso"></div>
  <div id="topo"></div>
  <nav id="tabs" role="tablist">
    <button role="tab" data-t="hoje" aria-selected="true">Hoje</button>
    <button role="tab" data-t="semana" aria-selected="false">Semanas</button>
    <button role="tab" data-t="vocab" aria-selected="false">Vocabulário</button>
    <button role="tab" data-t="medicao" aria-selected="false">Medição</button>
  </nav>
  <section id="hoje" class="on"></section>
  <section id="semana"></section>
  <section id="vocab"></section>
  <section id="medicao"></section>
</main>
<div id="modo" hidden></div>

<script src="assets/progresso.js?v=20261105"></script>
<script src="assets/ingles.js?v=20261105"></script>
<script src="assets/gram.js"></script>
<script>
(function(){
'use strict';
var K=window.CP_INGLES, G=window.CP_GRAM, GC={}, ref=null, C={}, escrita=Promise.resolve(), ultimoSalvar=0, semanaAba=0, R=null, tp=null;
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function hoje(){return new Date()}
function dm(dt){return String(dt.getDate()).padStart(2,'0')+'/'+String(dt.getMonth()+1).padStart(2,'0')}
function barra(p){return '<div class="barra" role="progressbar" aria-valuenow="'+p+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+p+'%"></i></div>'}
function copiar(txt){
  function fallback(){var t=document.createElement('textarea');t.value=txt;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch(e){}t.remove()}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).catch(fallback);else fallback();
}

/* Escritas em fila (uma de cada vez): o "update" lê e regrava o documento. */
function salvar(patch){
  Object.keys(patch).forEach(function(k){C[k]=patch[k]});
  ultimoSalvar=Date.now();
  render();
  if(!ref)return Promise.resolve();
  escrita=escrita.then(function(){return ref.update(patch)}).catch(function(e){console.error('falha ao salvar',e)}).then(function(){ultimoSalvar=Date.now()});
  return escrita;
}

/* ---------- peças ---------- */
function passos(t){
  return '<ol class="passos">'+t.como.map(function(c){return '<li>'+esc(c)+'</li>'}).join('')+'</ol>'+(t.pronto?'<div class="pronto"><b>Pronto quando:</b> '+esc(t.pronto)+'</div>':'');
}
function contador(t){
  var n=Math.min(t.vezes,(C.cont&&C.cont[t.id])||0);
  return '<div class="cont"><button type="button" data-c="'+t.id+'|-1" aria-label="Menos uma sessão">−</button><b>'+n+' de '+t.vezes+'</b><button type="button" data-c="'+t.id+'|1" aria-label="Mais uma sessão">+</button></div>';
}
function tarefa(x){
  var t=x.t, n=Math.min(t.vezes,(C.cont&&C.cont[t.id])||0), f=n>=t.vezes;
  return '<div class="tar'+(f?' ok':'')+'"><div class="tx"><span class="tag">'+t.min+' min × '+t.vezes+'</span><div><b>'+esc(t.t)+'</b></div>'+contador(t)+
    '<details class="dia"><summary>Como fazer</summary><div class="corpo">'+passos(t)+'</div></details></div></div>';
}
function estruturas(s){
  return s.estruturas.map(function(e,i){return '<div class="molde"><b>'+(i+1)+'. '+esc(e[0])+'</b>'+esc(e[1])+'</div>'}).join('');
}

/* ---------- aulas do curso (por dia) ---------- */
function ddmm(s){var p=s.split('-');return p[2]+'/'+p[1]}
function cursoBloco(){
  var r=K.cursoResumo(C,hoje()), pct=Math.min(100,Math.round(r.semana/r.meta*100));
  var h='<div class="cartao resumo"><div class="rotulo">Minhas aulas do curso</div>'+
    '<h3 style="margin:6px 0">'+r.semana+' de '+r.meta+' nesta semana'+(r.semana>=r.meta?' · meta batida ✓':'')+'</h3>'+barra(pct)+
    '<div class="row"><button class="btn primary" data-cursohoje="1"'+(r.hoje?' disabled':'')+'>'+(r.hoje?'Aula de hoje registrada ✓':'Tive aula hoje')+'</button></div>'+
    '<div class="row" style="margin-top:8px"><label class="mini" for="cursodata">Outro dia</label><input type="date" id="cursodata" max="'+K.iso(hoje())+'" value="'+K.iso(hoje())+'"><button class="btn" data-cursodata="1">Registrar</button></div>'+
    '<div class="mini" style="margin-top:8px">Semana de segunda a domingo. '+r.total+' aula'+(r.total===1?'':'s')+' registrada'+(r.total===1?'':'s')+' no total.</div>';
  if(r.lista.length)h+='<details style="margin-top:10px"><summary>Dias com aula</summary><div class="corpo">'+r.lista.map(function(x){
    return '<div style="padding:8px 0;border-top:1px solid var(--t-line)"><div class="row"><b>'+ddmm(x.data)+'</b><span class="sp"></span><button class="btn" data-cursodel="'+x.data+'" aria-label="Remover aula de '+ddmm(x.data)+'">Remover</button></div>'+
      '<input type="text" maxlength="500" style="width:100%;margin-top:6px" placeholder="O que viu na aula (opcional)" value="'+esc(x.nota)+'" data-cursonota="'+x.data+'" aria-label="Nota da aula de '+ddmm(x.data)+'"></div>';}).join('')+'</div></details>';
  $('#curso').innerHTML=h+'</div>';
}

/* ---------- topo ---------- */
function topo(e){
  var el=$('#topo');
  if(!e.ativo){el.innerHTML='';return}
  var sem=e.comecaEm>0?'<div class="big">em '+e.comecaEm+' d</div><small>o ciclo começa</small>':e.encerrado?'<div class="big">fim</div><small>ciclo terminou em '+dm(K.parse(e.fim))+'</small>':'<div class="big">'+e.semana+' de 4</div><small>até '+dm(K.addDias(K.dataDaSemana(C,e.semana),6))+'</small>';
  var ps=e.semana?e.porSemana[e.semana]:null;
  el.innerHTML='<div class="cartao resumo"><div class="stats">'+
    '<div><div class="rotulo">Semana</div>'+sem+'</div>'+
    '<div><div class="rotulo">Prática</div><div class="big">'+K.fmtMin(ps?ps.feito:0)+'</div><small>de '+K.fmtMin(K.MIN_ING)+'</small></div>'+
    '<div><div class="rotulo">Aulas</div><div class="big">'+K.cursoResumo(C,hoje()).semana+' de '+K.AULAS_SEMANA+'</div><small>aulas do curso</small></div></div>'+
    barra(e.pct)+'<div class="mini">'+e.pct+'% da prática do ciclo · '+e.aulasTotal+' aulas · '+e.vocab.vistos+' de '+e.vocab.total+' expressões vistas</div></div>';
}

/* ---------- hoje ---------- */
function setup(){
  return '<div class="cartao"><h2>Começar</h2><p class="sub">Quatro semanas a partir da data de início.</p>'+
    '<form class="f" id="setup"><label class="full">Data de início<input type="date" name="inicio" value="'+K.iso(hoje())+'" required></label>'+
    '<div class="full row"><button class="btn primary" type="submit">Começar</button></div></form>'+
    '<div class="dica">Por semana: 3 gravações de fala em cenários de carreira (entrevista, conversa técnica, reuniões, negociação), shadowing, escuta ativa e 15 expressões novas em cartões com repetição espaçada.</div></div>';
}
function gramCard(){
  var g=G.estado(GC,hoje()), px=g.prox;
  return '<div class="cartao"><div class="rotulo">Gramática · 12 aulas</div><h3 style="margin:6px 0">'+(px?'Aula '+px.ordem+': '+esc(px.titulo):'Trilha de gramática concluída')+'</h3>'+barra(g.pct)+'<div class="mini">'+g.completas+' de '+g.total+' aulas concluídas · '+g.pct+'% das etapas. Gramática aplicada ao que você fala em entrevista, reunião e negociação.</div>'+
    '<div class="row" style="margin-top:10px"><a class="btn primary" href="gramatica.html" style="text-decoration:none;display:inline-flex;align-items:center">'+(g.passos?'Continuar a gramática':'Começar a gramática')+'</a></div></div>';
}
function hojeHtml(e){
  if(!e.ativo)return gramCard()+setup();
  var h='', n=Math.max(1,e.semana||1), s=K.INGLES[n-1];
  if(e.comecaEm>0)h+='<div class="dica">O ciclo começa em '+e.comecaEm+' dia'+(e.comecaEm>1?'s':'')+'. Se quiser, já pode começar pela primeira prática.</div>';
  if(e.encerrado)h+='<div class="dica">O ciclo terminou. Veja a aba Medição para comparar o início e o fim; para continuar, comece um novo ciclo ajustando a data de início.</div>';
  if(e.atrasadas>0)h+='<div class="dica">'+e.atrasadas+' sessão'+(e.atrasadas>1?'ões':'')+' de semanas anteriores ficou'+(e.atrasadas>1?'ram':'')+' para trás. Sem problema: elas vêm primeiro, uma de cada vez.</div>';
  h+=gramCard();
  var v=e.vocab;
  h+='<div class="cartao"><div class="rotulo">Vocabulário de hoje</div><h3 style="margin:6px 0">'+(v.sessao?v.devidos+' para revisar · '+v.novosHoje+' novas':'Nada para hoje')+'</h3>'+
    '<div class="mini">'+(v.sessao?'Uma sessão leva uns 7 minutos. Antes de ver a resposta, tente dizer em voz alta.':'Você já fez as revisões e as novas de hoje. Volte amanhã.')+'</div>'+
    (v.sessao?'<div class="row" style="margin-top:10px"><button class="btn primary" data-cart="1">Começar cartões</button></div>':'')+'</div>';
  if(e.prox){
    var t=e.prox.t;
    h+='<div class="cartao"><div class="rotulo">Próxima prática'+(e.proxAdiantada?' · adiantando':' · semana '+e.prox.semana)+'</div>'+
      '<h2 style="margin:6px 0">'+esc(t.t)+'</h2><div><span class="tag">'+t.min+' min por sessão</span></div>'+
      '<div class="corpo">'+passos(t)+'</div>'+contador(t)+'</div>';
  }else h+='<div class="cartao"><h2>Prática completa</h2><p>Todas as práticas do ciclo estão marcadas.</p></div>';
  h+='<div class="cartao"><div class="rotulo">Como aproveitar a aula em grupo · semana '+n+'</div><p style="margin:6px 0">'+esc(s.pauta)+'</p></div>';
  return h;
}

/* ---------- semanas ---------- */
function semanaHtml(e){
  if(!e.ativo)return setup();
  return K.INGLES.map(function(s){
    var ps=e.porSemana[s.n], aberto=(e.semana||1)===s.n?' open':'';
    return '<details class="sem"'+aberto+'><summary>Semana '+s.n+' · '+esc(s.foco)+' <span class="mini">'+dm(K.dataDaSemana(C,s.n))+' a '+dm(K.addDias(K.dataDaSemana(C,s.n),6))+'</span></summary><div class="corpo">'+
      '<p class="mini">'+esc(s.porque)+'</p>'+barra(ps.min?Math.round(ps.feito/ps.min*100):0)+
      '<div class="rotulo">Prática · '+K.fmtMin(ps.feito)+' de '+K.fmtMin(ps.min)+'</div>'+
      '<div class="rotulo" style="margin-top:10px">Estruturas para usar na fala</div>'+estruturas(s)+
      '<div class="pronto"><b>Na aula em grupo:</b> '+esc(s.pauta)+'</div>'+
      s.tarefas.map(function(t){return tarefa({t:t,semana:s.n})}).join('')+'</div></details>';
  }).join('');
}

/* ---------- vocabulário ---------- */
function vocabHtml(e){
  if(!e.ativo)return setup();
  var n=semanaAba||Math.max(1,e.semana||1), s=K.INGLES[n-1], v=e.vocab;
  return '<div class="cartao"><h2>Vocabulário de carreira</h2><p class="mini">60 expressões em 4 semanas, na ordem do que você vai precisar: entrevista, conversa técnica, reuniões e negociação. Elas ficam disponíveis semana a semana, com no máximo '+K.NOVOS_DIA+' novas por dia.</p>'+
    '<div class="stats"><div><div class="rotulo">Vistas</div><div class="big">'+v.vistos+'</div><small>de '+v.total+'</small></div><div><div class="rotulo">Firmes</div><div class="big">'+v.dominados+'</div><small>voltam espaçadas</small></div><div><div class="rotulo">Revisar hoje</div><div class="big">'+v.devidos+'</div></div></div>'+
    (v.sessao?'<div class="row" style="margin-top:8px"><button class="btn primary" data-cart="1">Começar cartões</button></div>':'')+'</div>'+
    '<div class="cartao"><div class="row"><h3 class="sp" style="margin:0">Semana '+n+' · '+esc(s.foco)+'</h3><select id="selsem" aria-label="Semana">'+K.INGLES.map(function(x){return '<option value="'+x.n+'"'+(x.n===n?' selected':'')+'>Semana '+x.n+'</option>'}).join('')+'</select></div>'+
    '<p class="mini">Os exemplos são modelos: ajuste para a sua realidade e só afirme o que for verdade.</p>'+
    s.vocab.map(function(c){return '<div class="voc"><b>'+esc(c.en)+'</b><span class="mini">'+esc(c.pt)+'</span><div class="e">'+esc(c.ex)+'</div>'+(c.nota?'<div class="mini">Pronúncia: '+esc(c.nota)+'</div>':'')+'</div>'}).join('')+
    '<div class="row" style="margin-top:10px"><button class="btn" data-anki="'+n+'">Copiar para o Anki</button></div>'+
    '<div class="mini" style="margin-top:6px">No Anki: Arquivo › Importar, separador ponto e vírgula (situação;expressão — exemplo).</div></div>'+
    '<div class="cartao"><h3>Fontes para a escuta ativa</h3><p class="mini">Tema da semana '+n+': '+esc(s.tema)+'. Sugestões para procurar (confira se há episódio atual no tema):</p><ul class="passos">'+K.ESCUTA.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div>';
}

/* ---------- medição ---------- */
function num(v){return +String(v==null?'':v).replace(',','.')}
function medicaoHtml(e){
  if(!e.ativo)return setup();
  var r=C.res||{}, a=num(r.wpm0), b=num(r.wpm1), h0=num(r.hes0), h1=num(r.hes1), d='';
  if(a>0&&b>0)d+='<div class="pronto"><b>Velocidade:</b> '+(b-a>0?'+':'')+Math.round(b-a)+' palavras por minuto ('+(b-a>0?'+':'')+Math.round((b-a)/a*100)+'%).</div>';
  if(r.hes0!==''&&r.hes1!==''&&r.hes0!=null&&r.hes1!=null&&!isNaN(h0)&&!isNaN(h1))d+='<div class="pronto"><b>Hesitações em 2 minutos:</b> de '+h0+' para '+h1+'.</div>';
  return '<div class="cartao"><h2>Medição de fala</h2><p>Meça do mesmo jeito no início (semana 1) e no fim (semana 4): 2 minutos respondendo “Tell me about yourself”. Palavras por minuto e hesitações são só dois sinais da fluência, mas dão um número para comparar.</p>'+
    '<div class="campos"><label>Palavras/min no início<input data-res="wpm0" inputmode="decimal" value="'+esc(r.wpm0||'')+'" placeholder="—" maxlength="8"></label>'+
    '<label>Palavras/min no fim<input data-res="wpm1" inputmode="decimal" value="'+esc(r.wpm1||'')+'" placeholder="—" maxlength="8"></label>'+
    '<label>Hesitações no início<input data-res="hes0" inputmode="numeric" value="'+esc(r.hes0||'')+'" placeholder="—" maxlength="4"></label>'+
    '<label>Hesitações no fim<input data-res="hes1" inputmode="numeric" value="'+esc(r.hes1||'')+'" placeholder="—" maxlength="4"></label></div>'+d+
    '<div class="dica">Como medir: grave 2 minutos, cole a transcrição no corretor da aba Inglês da <a href="rota-internacional.html">Rota Internacional</a>, informe a duração e clique em “Registrar só a medição”. Ela calcula as palavras por minuto. Hesitações: conte pausas longas (mais de 2 segundos) e muletas ao ouvir a gravação.</div></div>';
}

/* ---------- cartões (repetição espaçada) ---------- */
function persistir(imediato){
  clearTimeout(tp);
  if(imediato){salvar({srs:C.srs});return}
  tp=setTimeout(function(){salvar({srs:C.srs})},1500);
}
function abrirCartoes(){
  var f=K.fila(C,hoje());
  if(!f.sessao.length)return;
  R={fila:f.sessao.slice(),i:0,mostrou:false,ok:0,erro:0,rep:{}};
  $('#modo').hidden=false;document.body.style.overflow='hidden';telaCartao();
}
function telaCartao(){
  var m=$('#modo');
  if(R.i>=R.fila.length){
    var tot=R.ok+R.erro;
    m.innerHTML='<div class="wrap"><h2>Sessão concluída</h2><p>Lembrou de <b>'+R.ok+'</b> de '+tot+' respostas. As que você errou voltam amanhã; as que acertou voltam mais espaçadas.</p>'+
      (tot>=5?'<p class="mini">Contei esta sessão no seu contador de cartões da semana.</p>':'')+
      '<button class="grande pri" style="width:100%" data-fim="1">Fechar</button></div>';
    return;
  }
  var c=R.fila[R.i], n=R.fila.length;
  var corpo=R.mostrou?
    '<div class="flash"><div class="pt">'+esc(c.pt)+'</div><div class="en" style="margin-top:12px">'+esc(c.en)+'</div><div class="ex">'+esc(c.ex)+'</div>'+(c.nota?'<div class="nota">Pronúncia: '+esc(c.nota)+'</div>':'')+
    '<div class="nota"><b>Agora diga em voz alta uma frase sua com essa expressão</b> (só o que for verdade).</div></div>'+
    '<div class="resp"><button data-resp="0">Não lembrei</button><button class="sim" data-resp="1">Lembrei</button></div>':
    '<div class="flash"><div class="rotulo">Como dizer em inglês?</div><div class="pt" style="margin-top:8px">'+esc(c.pt)+'</div><div class="nota">Tente dizer em voz alta antes de virar o cartão.</div></div>'+
    '<button class="grande pri" style="width:100%" data-mostrar="1">Mostrar resposta</button>';
  m.innerHTML='<div class="wrap"><div class="row"><b class="sp">Cartão '+(R.i+1)+' de '+n+'</b><button class="lk" data-sair="1">Sair</button></div>'+barra(Math.round(R.i/n*100))+corpo+'</div>';
}
function responder(ok){
  var c=R.fila[R.i];
  C.srs=K.responder(C,c.id,ok,hoje());
  if(ok)R.ok++;else{R.erro++;if(!R.rep[c.id]){R.rep[c.id]=1;R.fila.push(c)}}
  R.i++;R.mostrou=false;persistir(false);telaCartao();
}
function fecharCartoes(contar){
  var tot=R?R.ok+R.erro:0, patch={srs:C.srs||{}};
  if(contar&&tot>=5){var e=K.estado(C,hoje()),n=Math.min(4,Math.max(1,e.semana||1));patch.cont=K.contar(C,n+'-vc',1)}
  R=null;clearTimeout(tp);$('#modo').hidden=true;document.body.style.overflow='';
  salvar(patch);
}

/* ---------- render ---------- */
function render(){
  var ae=document.activeElement;
  if(ae&&ae.matches&&ae.matches('[data-res],[data-cursonota]'))return; // não pisa em quem está digitando
  var e=K.estado(C,hoje());
  cursoBloco();
  topo(e);
  $('#hoje').innerHTML=hojeHtml(e);
  var abertas=[].map.call(document.querySelectorAll('#semana details.sem'),function(d){return d.open});
  $('#semana').innerHTML=semanaHtml(e);
  if(abertas.length)document.querySelectorAll('#semana details.sem').forEach(function(d,i){d.open=!!abertas[i]});
  $('#vocab').innerHTML=vocabHtml(e);
  $('#medicao').innerHTML=medicaoHtml(e);
}

/* ---------- eventos ---------- */
document.addEventListener('submit',function(ev){
  var f=ev.target;
  if(f.id==='setup'){ev.preventDefault();if(!f.inicio.value)return;salvar({inicio:f.inicio.value,cont:C.cont||{},aulas:C.aulas||{},curso:C.curso||{},res:C.res||{},srs:C.srs||{}})}
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.dataset&&t.dataset.res){var Rr=Object.assign({},C.res||{});Rr[t.dataset.res]=t.value.trim();salvar({res:Rr})}
  if(t.id==='selsem'){semanaAba=+t.value;render()}
  if(t.dataset&&t.dataset.cursonota){salvar({curso:K.cursoMarcar(C,t.dataset.cursonota,t.value.trim())})}
});
document.addEventListener('click',function(ev){
  var b=ev.target.closest('button');if(!b)return;
  var d=b.dataset;
  if(d.c){var p=d.c.split('|');salvar({cont:K.contar(C,p[0],+p[1])})}
  else if(d.cursohoje){salvar({curso:K.cursoMarcar(C,K.iso(hoje()))})}
  else if(d.cursodata){var dt=$('#cursodata').value;if(dt&&dt<=K.iso(hoje()))salvar({curso:K.cursoMarcar(C,dt)})}
  else if(d.cursodel){if(confirm('Remover a aula de '+d.cursodel.split('-').reverse().join('/')+'?'))salvar({curso:K.cursoRemover(C,d.cursodel)})}
  else if(d.anki){copiar(K.cartoesAnki(+d.anki));b.textContent='Copiado ✓'}
  else if(d.cart){abrirCartoes()}
  else if(d.mostrar&&R){R.mostrou=true;telaCartao()}
  else if(d.resp!==undefined&&R){responder(d.resp==='1')}
  else if(d.sair&&R){fecharCartoes(false)}
  else if(d.fim){fecharCartoes(true)}
});
$('#tabs').addEventListener('click',function(ev){var b=ev.target.closest('button');if(!b)return;
  $('#tabs').querySelectorAll('button').forEach(function(x){x.setAttribute('aria-selected',x===b)});
  document.querySelectorAll('section').forEach(function(s){s.classList.toggle('on',s.id===b.dataset.t)})});

render();
claude.use('db').then(function(db){
  ref=db.doc('ingles/main');
  ref.onSnapshot(function(s){if(R||Date.now()-ultimoSalvar<2500)return;C=s.exists?(s.data()||{}):{};render()});
  db.doc('gram/main').onSnapshot(function(s){GC=s.exists?(s.data()||{}):{};if(!R)render()});
});
})();
</script>
<script src="assets/modulo.js"></script>
</body>
</html>
